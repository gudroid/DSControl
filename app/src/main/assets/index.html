<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08080b">
<title>DS Control</title>
<style>
:root{
  --bg:#08080b; --bg-soft:#0e0e13; --surf:#141419; --surf2:#1c1c23; --surf3:#24242d;
  --line:#ffffff12; --line2:#ffffff20;
  --txt:#f6f6f9; --sub:#a0a0b0; --dim:#6a6a78;
  --acc:#ff2e46; --acc2:#ff6a3d; --acc-soft:#ff2e4622; --ok:#28e0a4; --warn:#ffc043;
  --grad:linear-gradient(135deg,#ff2e46 0%,#ff6a3d 100%);
  --grad-soft:linear-gradient(135deg,#ff2e4633,#ff6a3d22);
  --r:22px; --r2:16px; --r3:12px;
  --sh:0 12px 40px -12px #000a; --sh2:0 20px 60px -20px #000c;
  --ease:cubic-bezier(.22,.8,.18,1);
  --nav-h:66px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(90% 60% at 50% -10%,#ff2e4618,transparent 60%),radial-gradient(70% 50% at 100% 0%,#ff6a3d10,transparent 55%);pointer-events:none;z-index:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
svg{display:block;flex:none}
img{display:block}
.hide{display:none!important}
::-webkit-scrollbar{width:0;height:0}
b{font-weight:700}

/* ===== LAYOUT ===== */
#app{position:relative;z-index:1;display:grid;height:100%;grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.logo{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 8px 22px -6px #ff2e4688}
.logo svg{width:21px;height:21px;color:#fff}
.brand{flex:1;min-width:0;line-height:1.12}
.brand b{font-size:16.5px;font-weight:800;letter-spacing:-.2px}
.brand small{display:block;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.2px}
.hbtn{height:40px;min-width:40px;padding:0 13px;border-radius:13px;background:var(--surf);border:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;transition:transform .12s var(--ease),background .2s}
.hbtn:active{transform:scale(.94)}
.hbtn svg{width:18px;height:18px}
.hbtn .dot{width:8px;height:8px;border-radius:50%;background:#555;transition:.3s}
.hbtn.on{border-color:#28e0a455}.hbtn.on .dot{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.hbtn.demo .dot{background:var(--warn)}
.pwr.on{color:var(--ok);border-color:#28e0a455}
.pwr.off{color:var(--acc);border-color:#ff2e4655}

#side{display:none}
#main{overflow-y:auto;overflow-x:hidden;padding:12px 16px calc(var(--nav-h) + 96px);min-width:0;scroll-behavior:auto}
#npPanel{display:none}

nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:0 6px env(safe-area-inset-bottom);background:#0b0b10e6;backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);border-top:1px solid var(--line)}
nav#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0;font-size:10px;font-weight:700;color:var(--dim);border-radius:14px;transition:color .2s}
nav#tabs svg{width:23px;height:23px;transition:transform .2s var(--ease)}
nav#tabs button.on{color:var(--txt)}
nav#tabs button.on svg{color:var(--acc);transform:translateY(-1px) scale(1.06)}

/* tablet / landscape */
@media (min-width:900px){
  #app{grid-template-columns:228px 1fr 372px;grid-template-rows:auto 1fr}
  header{grid-column:1/-1}
  #side{display:flex;flex-direction:column;gap:3px;padding:10px 12px;overflow-y:auto}
  #side .slabel{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--dim);padding:10px 14px 6px;text-transform:uppercase}
  #side button.navi{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:14px;font-weight:700;font-size:14.5px;color:var(--sub);transition:background .2s,color .2s}
  #side button.navi svg{width:21px;height:21px}
  #side button.navi.on{background:var(--surf);color:var(--txt)}
  #side button.navi.on svg{color:var(--acc)}
  #side .sep{height:1px;background:var(--line);margin:10px 8px}
  #main{padding:16px 24px 40px}
  #npPanel{display:block;overflow-y:auto;overflow-x:hidden;padding:16px;min-width:0}
  nav#tabs,#mini{display:none!important}
  .onlyMobile{display:none!important}
}
@media (min-width:900px) and (max-width:1120px){#app{grid-template-columns:78px 1fr 330px}#side button.navi span,#side .slabel{display:none}#side button.navi{justify-content:center}}

/* ===== TIPOGRAFIA / BLOCOS ===== */
.title{font-size:26px;font-weight:850;letter-spacing:-.6px;margin:6px 2px 16px}
.title small{display:block;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:0;margin-top:4px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--dim);font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 12px}
.sect b{font-size:17px;font-weight:800;letter-spacing:-.3px}
.sect button{font-size:13px;color:var(--acc);font-weight:700}
.note{font-size:12.5px;color:var(--sub);line-height:1.55}
.pill{font-size:11px;font-weight:750;padding:5px 11px;border-radius:999px;background:#ffffff12;color:#d2d2dc;white-space:nowrap}
.pill.acc{background:var(--acc-soft);color:#ff8f99}
.pill.ok{background:#28e0a422;color:#28e0a4}
.pill.warn{background:#ffc04322;color:#ffc043}

/* ===== CAPAS ===== */
.cover{position:relative;border-radius:14px;overflow:hidden;background:var(--surf2);display:grid;place-items:center;flex:none;color:#ffffff40;isolation:isolate}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover svg{width:40%;height:40%;color:#ffffff55}
.cover .ini{font-weight:900;color:#fff;letter-spacing:-.5px}

/* ===== BOTÕES ===== */
.bigbtn{width:100%;padding:15px;border-radius:16px;background:var(--grad);font-weight:800;font-size:15px;display:flex;gap:9px;justify-content:center;align-items:center;box-shadow:0 10px 26px -8px #ff2e4688;transition:transform .12s var(--ease)}
.bigbtn:active{transform:scale(.97)}
.bigbtn svg{width:20px;height:20px}
.btn2{padding:13px;border-radius:14px;background:var(--surf2);border:1px solid var(--line);font-weight:700;font-size:14px;display:flex;gap:8px;justify-content:center;align-items:center;transition:transform .12s var(--ease),background .2s}
.btn2:active{transform:scale(.96)}
.btn2 svg{width:18px;height:18px}
.btn2.danger{color:#ff8f99}
.ghost{width:100%;padding:14px;border-radius:15px;border:1px dashed var(--line2);color:var(--sub);font-weight:700;display:flex;gap:8px;justify-content:center;align-items:center}
.ghost svg{width:18px;height:18px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.mini-b{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--dim);flex:none;transition:transform .12s var(--ease),color .2s}
.mini-b:active{transform:scale(.9)}.mini-b svg{width:19px;height:19px}.mini-b.on{color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 14px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--sub);transition:.18s}
.chip svg{width:16px;height:16px}
.chip.on{background:var(--acc-soft);border-color:#ff2e4666;color:#ffb0b7}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{padding:11px 6px;border-radius:10px;font-weight:750;font-size:13px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:5px;transition:.2s var(--ease)}
.seg button svg{width:20px;height:20px}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px -6px #ff2e4688}

/* ===== NOW PLAYING CARD (compacto) ===== */
.nowcard{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);padding:16px;margin-bottom:14px;background:var(--surf)}
.nowcard .bg{position:absolute;inset:-30%;background-size:cover;background-position:center;filter:blur(44px) saturate(1.5);opacity:.4;z-index:0}
.nowcard .shade{position:absolute;inset:0;background:linear-gradient(180deg,#141419aa,#141419ee);z-index:0}
.nowcard>*:not(.bg):not(.shade){position:relative;z-index:1}
.nowcard .top{display:flex;gap:14px;align-items:center}
.nowcard .cover{width:68px;height:68px;border-radius:16px}
.nowcard .meta{flex:1;min-width:0}
.nowcard .meta b{display:block;font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowcard .meta small{color:var(--sub);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.time{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.time .bar{flex:1;height:6px;border-radius:9px;background:#ffffff1e;overflow:hidden}
.time .bar i{display:block;height:100%;background:var(--grad);width:0;transition:width .9s linear}
.expand{width:40px;height:40px;border-radius:12px;background:#ffffff10;display:grid;place-items:center;color:var(--sub);flex:none}
.expand svg{width:20px;height:20px}
.mini-transport{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.tb{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#ffffff0e;flex:none;transition:transform .12s var(--ease)}
.tb:active{transform:scale(.88)}
.tb svg{width:23px;height:23px}
.tb.big{width:66px;height:66px;background:var(--grad);box-shadow:0 12px 28px -8px #ff2e46aa}
.tb.big svg{width:29px;height:29px}
.tb.sm{width:42px;height:42px;background:transparent;color:var(--sub)}
.tb.sm svg{width:20px;height:20px}

/* ===== LISTAS ===== */
.toolbar{display:flex;gap:8px;margin-bottom:12px;position:sticky;top:-12px;z-index:6;background:var(--bg);padding:8px 0}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:0 13px}
.search svg{width:18px;height:18px;color:var(--dim)}
.search input{flex:1;min-width:0;width:100%;background:none;border:0;outline:none;padding:13px 0;font-size:15px}
.ib{width:46px;height:46px;border-radius:14px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--sub);transition:transform .12s}
.ib:active{transform:scale(.92)}.ib svg{width:20px;height:20px}
.crumbs{display:flex;align-items:center;gap:6px;margin-bottom:8px;overflow-x:auto;white-space:nowrap}
.back{display:flex;align-items:center;gap:4px;padding:9px 14px 9px 10px;border-radius:12px;background:var(--grad);font-weight:800;font-size:13px;flex:none}
.back svg{width:18px;height:18px}
.crumb{padding:9px 11px;border-radius:10px;background:var(--surf);font-size:13px;color:var(--sub);flex:none;font-weight:650}
.crumb.cur{color:var(--txt);font-weight:800}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.fcard{text-align:left;position:relative}
.fcard .cover{width:100%;aspect-ratio:1;border-radius:18px;box-shadow:var(--sh)}
.fcard b{display:block;font-size:14px;font-weight:750;margin-top:9px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.fcard small{color:var(--dim);font-size:12px;font-weight:600}
.fcard .more{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:11px;background:#000000b0;backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff}
.fcard .more svg{width:18px;height:18px}
.fcard .sub{position:absolute;left:8px;top:8px;font-size:10px;font-weight:800;padding:4px 8px;border-radius:9px;background:#000000b0;backdrop-filter:blur(6px);display:flex;align-items:center;gap:4px}
.fcard.playing .cover{outline:3px solid var(--acc);outline-offset:-3px}
.flist .fcard{display:flex;align-items:center;gap:12px;padding:9px;border-radius:16px;background:var(--surf);border:1px solid var(--line);margin-bottom:9px}
.flist .fcard .cover{width:56px;height:56px;border-radius:12px;box-shadow:none}
.flist .fcard b{margin-top:0}.flist .fcard .more{position:static;background:none}.flist .fcard .sub{display:none}
.trk{display:flex;align-items:center;gap:12px;padding:7px 4px;border-radius:14px;width:100%;transition:background .15s}
.trk:active{background:var(--surf)}
.trk .cover{width:48px;height:48px;border-radius:12px}
.trk .tt{flex:1;min-width:0;text-align:left}
.trk .tt b{display:block;font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .tt small{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-weight:600}
.trk.playing .tt b{color:#ff8f99}
.trk .eqi{display:none}.trk.playing .eqi{display:flex}
.bars{display:flex;gap:2px;align-items:flex-end;height:15px;margin:0 2px}
.bars i{width:3px;background:var(--acc);border-radius:2px;animation:eq 1s infinite ease-in-out}
.bars i:nth-child(2){animation-delay:.25s}.bars i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:15px}}
.paused .bars i{animation:none;height:3px}

.plc{display:flex;align-items:center;gap:14px;padding:10px;border-radius:18px;background:var(--surf);border:1px solid var(--line);margin-bottom:10px;width:100%;text-align:left;transition:.15s}
.plc:active{background:var(--surf2)}
.plc .cover{width:60px;height:60px}
.plc b{display:block;font-size:15px;font-weight:750}
.plc small{color:var(--dim);font-size:12px;font-weight:600}
.plc.active{border-color:#ff2e4666}
.qrow{display:flex;align-items:center;gap:10px;padding:5px 0;min-width:0}
.qrow .trk{flex:1;min-width:0;padding:4px 0}.qrow .trk:active{background:none}
.qn{width:24px;text-align:center;color:var(--dim);font-weight:800;font-size:12px;flex:none}

.empty{text-align:center;color:var(--dim);padding:48px 20px;font-size:14px;line-height:1.55}
.empty svg{width:56px;height:56px;color:#2a2a35;margin:0 auto 14px}

/* ===== EQ ===== */
.eqwrap{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:8px 0 4px}
.band{display:flex;flex-direction:column;align-items:center;gap:8px}
.band .val{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;min-height:16px}
.band .lbl{font-size:11px;color:var(--dim);font-weight:700}
.vslide{position:relative;height:220px;width:42px;display:flex;justify-content:center;touch-action:none}
.vslide .track{position:absolute;top:0;bottom:0;width:8px;border-radius:9px;background:#ffffff14}
.vslide .zero{position:absolute;left:4px;right:4px;top:50%;height:2px;background:#ffffff2a}
.vslide .fill{position:absolute;width:8px;border-radius:9px;background:var(--grad)}
.vslide .knob{position:absolute;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 3px 14px #000a;transform:translateY(-50%);border:5px solid var(--acc)}
.eqcurve{width:100%;height:72px;margin-top:4px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.sw:last-child{border:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;flex:1;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--acc) var(--p,40%),#ffffff1a var(--p,40%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 12px #0009}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:0}

/* ===== PROGRESSO/SCAN ===== */
.scanbar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surf);border:1px solid var(--line);margin-bottom:14px}
.scanbar .t{flex:1;min-width:0}.scanbar b{font-size:13px}.scanbar small{display:block;color:var(--dim);font-size:11.5px;font-weight:600}
.progress{height:6px;border-radius:9px;background:#ffffff14;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--grad);width:0;transition:width .3s}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid #ffffff22;border-top-color:var(--acc);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== MINI PLAYER ===== */
#mini{position:fixed;left:10px;right:10px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 6px);z-index:19;display:flex;align-items:center;gap:11px;background:#17171fee;backdrop-filter:blur(18px);border:1px solid var(--line2);border-radius:18px;padding:7px;box-shadow:var(--sh2);overflow:hidden}
#mini .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--grad);width:0;transition:width .9s linear}
#mini .cover{width:46px;height:46px;border-radius:11px}
#mini .t{flex:1;min-width:0}
#mini b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini small{color:var(--dim);font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#mini .tb{width:42px;height:42px}#mini .tb svg{width:20px;height:20px}#mini .tb.big{width:46px;height:46px;box-shadow:none}

/* ===== PLAYER TELA CHEIA ===== */
#player{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s var(--ease);overflow:hidden}
#player.on{transform:none}
#player .pbg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(60px) saturate(1.6) brightness(.6);transform:scale(1.2);z-index:0}
#player .pshade{position:absolute;inset:0;background:linear-gradient(180deg,#08080b55,#08080bdd 55%,#08080b);z-index:0}
#player .pinner{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));overflow-y:auto}
#player .phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;position:relative}
#player .pclock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:850;letter-spacing:1px;font-variant-numeric:tabular-nums;pointer-events:none}
#player .pright{display:flex;gap:8px}
#player .ptime .bar{cursor:pointer}
#player .phead .pill{background:#ffffff14}
#player .pdown{width:42px;height:42px;border-radius:13px;background:#ffffff12;display:grid;place-items:center}
#player .pdown svg{width:22px;height:22px}
#player .part{width:min(78vw,340px);aspect-ratio:1;border-radius:26px;margin:min(5vh,34px) auto;box-shadow:0 30px 70px -20px #000e}
#player .pt{font-size:25px;font-weight:850;letter-spacing:-.5px;text-align:center;line-height:1.18;word-break:break-word}
#player .ps{color:var(--sub);font-size:14px;text-align:center;margin-top:7px;font-weight:600}
#player .ptime{display:flex;align-items:center;gap:11px;margin-top:22px;font-size:12px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
#player .ptime{padding:4px 0}
#player .ptime .bar{flex:1;height:8px;border-radius:9px;background:#ffffff1e;overflow:hidden}
#player .ptime .bar i{display:block;height:100%;background:var(--grad);width:0;transition:width .9s linear}
#player .ptransport{display:flex;align-items:center;justify-content:center;gap:clamp(10px,5vw,26px);margin-top:20px}
#player .pvol{display:flex;align-items:center;gap:12px;margin-top:22px}
#player .pvol svg{width:20px;height:20px;color:var(--sub)}

#player .pextra{display:flex;gap:10px;margin-top:20px}
#player .pextra .btn2{flex:1}
.maxw{max-width:560px;margin:0 auto;width:100%}

#npPanel .pt{font-size:19px;font-weight:850;text-align:center;line-height:1.2;word-break:break-word;letter-spacing:-.3px}
#npPanel .ps{color:var(--sub);font-size:13px;text-align:center;margin-top:6px;font-weight:600}
#npPanel .ptime{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:12px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
#npPanel .ptime .bar{flex:1;height:5px;border-radius:9px;background:#ffffff1e;overflow:hidden}
#npPanel .ptime .bar i{display:block;height:100%;background:var(--grad);width:0;transition:width .9s linear}
#npPanel .ptransport{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px}
#npPanel .pvol{display:flex;align-items:center;gap:10px;margin-top:16px}
#npPanel .pvol svg{width:20px;height:20px;color:var(--sub)}
#npPanel .pvol .num{min-width:26px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

#npPanel .tb svg{width:21px;height:21px}#npPanel .tb.big svg{width:26px;height:26px}#npPanel .tb.sm svg{width:18px;height:18px}

/* fonte BT / RCA / toggles */
.vol{display:flex;align-items:center;gap:12px}
.vol svg{width:20px;height:20px;color:var(--sub)}
.vol .num{min-width:28px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.appsrow{display:flex;gap:8px;justify-content:space-between;overflow-x:auto;padding-bottom:2px}
.appbtn{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1;min-width:56px}
.appbtn .ab{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 8px 18px -8px var(--c);transition:transform .12s var(--ease)}
.appbtn:active .ab{transform:scale(.9)}
.appbtn .ab svg{width:25px;height:25px}
.appbtn small{font-size:11px;color:var(--sub);font-weight:600;white-space:nowrap}
.tgl{width:48px;height:28px;border-radius:999px;background:var(--surf3);position:relative;flex:none;transition:.2s;border:1px solid var(--line);cursor:pointer}
.tgl.on{background:var(--grad);border-color:transparent}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s var(--ease)}
.tgl.on::after{left:22px}
.linkbtn{display:flex;align-items:center;gap:8px;justify-content:center;padding:9px;border-radius:12px;border:1px solid var(--line);color:var(--sub);font-size:12px;font-weight:700;margin:10px 0}
.linkbtn.on{border-color:#ff2e4666;color:#ff8f99;background:var(--acc-soft)}
.linkbtn svg{width:16px;height:16px;flex:none}

.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg-soft);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:0;animation:up .26s var(--ease)}

@keyframes up{from{transform:translateY(60px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 16px}
.sheet h3{font-size:19px;font-weight:850;letter-spacing:-.3px;margin-bottom:5px}

.field{width:100%;padding:14px;border-radius:14px;background:var(--surf);border:1px solid var(--line);outline:none;font-size:16px;margin-bottom:12px}

.artgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.artgrid button{aspect-ratio:1;border-radius:13px;overflow:hidden;background:var(--surf)}

.soc.wa .orb svg{width:38px;height:38px}
.soc small{font-size:12px;font-weight:700;color:var(--sub)}

.screen{animation:scin .22s var(--ease)}
@keyframes scin{from{opacity:0;transform:translateY(6px)}}

// capas ficam no IndexedDB (cabe muito mais que o localStorage)
const IDB={db:null,mem:{},
  open(){return new Promise(r=>{try{const q=indexedDB.open('dscontrol',1);q.onupgradeneeded=()=>q.result.createObjectStore('covers');q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
  async loadAll(){if(!this.db)return;return new Promise(r=>{const t=this.db.transaction('covers').objectStore('covers');const rq=t.openCursor();rq.onsuccess=e=>{const c=e.target.result;if(c){this.mem[c.key]=c.value;c.continue()}else r()};rq.onerror=()=>r()})},
  set(k,v){this.mem[k]=v;if(this.db){const t=this.db.transaction('covers','readwrite');v==null?t.objectStore('covers').delete(k):t.objectStore('covers').put(v,k)}}

const B32A="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function b32(bytes){let bits='';for(const b of bytes)bits+=b.toString(2).padStart(8,'0');let o='';for(let i=0;i+5<=bits.length;i+=5)o+=B32A[parseInt(bits.slice(i,i+5),2)];return o.slice(0,8)}
// sha-256 (usa WebCrypto; fallback JS se o WebView não tiver)
async function sha5(str){
  try{const b=new TextEncoder().encode(str);const h=new Uint8Array(await crypto.subtle.digest('SHA-256',b));return [h[0],h[1],h[2],h[3],h[4]]}
  catch(e){const h=shaJS(str);return [h[0],h[1],h[2],h[3],h[4]]}
}
function shaJS(a){ // sha-256 mínimo (só p/ derivar o código do aparelho)
  function r(n,x){return(x>>>n)|(x<<(32-n))}
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const bytes=[];for(let i=0;i<a.length;i++)bytes.push(a.charCodeAt(i)&255);
  const l=bytes.length*8;bytes.push(0x80);while(bytes.length%64!==56)bytes.push(0);for(let i=7;i>=0;i--)bytes.push((l/Math.pow(2,i*8))&255);
  for(let j=0;j<bytes.length;j+=64){const w=new Array(64);for(let i=0;i<16;i++)w[i]=(bytes[j+i*4]<<24)|(bytes[j+i*4+1]<<16)|(bytes[j+i*4+2]<<8)|bytes[j+i*4+3];
    for(let i=16;i<64;i++){const s0=r(7,w[i-15])^r(18,w[i-15])^(w[i-15]>>>3);const s1=r(17,w[i-2])^r(19,w[i-2])^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    let[a0,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const S1=r(6,e)^r(11,e)^r(25,e);const ch=(e&f)^(~e&g);const t1=(h+S1+ch+K[i]+w[i])|0;const S0=r(2,a0)^r(13,a0)^r(22,a0);const mj=(a0&b)^(a0&c)^(b&c);const t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a0;a0=(t1+t2)|0}
    H=[(H[0]+a0)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  const out=[];for(const x of H){out.push((x>>>24)&255,(x>>>16)&255,(x>>>8)&255,x&255)}return out;
}
const LIC={
  KEY:'dsc_lic', code:'----', dev:null,
  read(){return LS.get(this.KEY,{exp:0,blocked:false,reason:'',used:[],t:0,trial:0})},
  write(o){o.sig=this.sig(o);LS.set(this.KEY,o)},
  sig(o){const s=[o.exp,o.blocked?1:0,(o.used||[]).join(','),Math.floor((o.t||0)/DAY),o.trial||0].join('|')+'#ds9f3a';let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h},
  now(){return Math.max(Date.now(),this.read().t||0)},
  tick(){const o=this.read();const t=Math.max(Date.now(),o.t||0);if(t!==o.t){o.t=t;this.write(o)}},
  async init(){
    let id='';try{if(NATIVE&&window.AndroidBLE.deviceId)id=window.AndroidBLE.deviceId()||''}catch(e){}
    if(!id){id=LS.get('dsc_dev','');if(!id){id='w'+Math.random().toString(36).slice(2)+Date.now().toString(36);LS.set('dsc_dev',id)}}
    this.dev=await sha5('DSC1|'+id);
    this.code=b32(this.dev);
    const o=this.read();
    if((o.exp||o.blocked)&&o.sig!==undefined&&o.sig!==this.sig(o))this.block('Dados da licença alterados');
    this.tick();
  },
  codeFmt(){return this.code.slice(0,4)+'-'+this.code.slice(4,8)},
  state(){const o=this.read();if(o.blocked)return'blocked';if(o.exp>this.now())return'active';if(o.exp>0)return'expired';return'none'},
  active(){return this.state()==='active'},
  reason(){return this.read().reason||''},
  leftDays(){return Math.max(0,Math.ceil((this.read().exp-this.now())/DAY))},
  leftHours(){return Math.max(0,Math.ceil((this.read().exp-this.now())/3600000))},
  block(r){const o=this.read();o.blocked=true;o.reason=r;this.write(o)},
  async verify(pay,sig){
    if(NATIVE&&window.AndroidBLE.licenseVerify){try{return window.AndroidBLE.licenseVerify(hex(pay).replace(/ /g,''),hex(sig).replace(/ /g,''))}catch(e){return false}}
    try{const der=Uint8Array.from(atob(LIC_PUB),c=>c.charCodeAt(0));const k=await crypto.subtle.importKey('spki',der,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,sig,pay)}catch(e){return false}
  },
  async activate(keyStr){
    this.tick();const o=this.read();
    try{
      let k=String(keyStr||'').trim();const p=k.indexOf('DSC1.');if(p<0)return{ok:false,msg:'Chave inválida'};
      k=k.slice(p+5);const AL='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';let e=0;while(e<k.length&&AL.indexOf(k[e])>=0)e++;k=k.slice(0,e);
      const raw=Uint8Array.from(atob(k.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
      if(raw.length!==76)return{ok:false,msg:'Chave incompleta. Copie a chave inteira.'};
      const pay=raw.slice(0,12),sig=raw.slice(12,76);
      if(!await this.verify(pay,sig))return{ok:false,msg:'Chave inválida'};
      for(let i=0;i<5;i++)if(pay[i]!==this.dev[i])return{ok:false,msg:'Esta chave é de outro aparelho'};
      const issue=(pay[5]<<8)|pay[6],days=(pay[7]<<8)|pay[8],type=pay[9],serial=(pay[10]<<8)|pay[11];
      const today=Math.floor((this.now()-LIC_EPOCH)/DAY);
      if(today-issue>10)return{ok:false,msg:'Chave vencida (passou de 10 dias). Peça uma nova.'};
      if(issue-today>2)return{ok:false,msg:'A data do aparelho está errada. Ajuste a data e tente de novo.'};
      const tag=issue+':'+serial;o.used=o.used||[];
      if(o.used.includes(tag))return{ok:false,msg:'Esta chave já foi usada'};
      o.used.push(tag);if(o.used.length>80)o.used=o.used.slice(-80);
      if(type===2){o.blocked=false;o.reason='';if(days>0)o.exp=Math.max(o.exp,this.now())+days*DAY;this.write(o);return{ok:true,msg:'Aparelho desbloqueado'}}
      if(type===3){o.exp=this.now();this.write(o);return{ok:true,msg:'Licença cancelada'}}
      if(o.blocked)return{ok:false,msg:'Aparelho bloqueado. Peça a chave de desbloqueio.'};
      o.exp=Math.max(o.exp,this.now())+days*DAY;this.write(o);
      return{ok:true,msg:'Ativado! +'+days+' dias'};
    }catch(e){return{ok:false,msg:'Chave inválida'}}
  },
  trialLeft(){return !this.read().trial},
  startTrial(){const o=this.read();if(o.trial)return false;o.trial=1;o.exp=Math.max(o.exp,this.now())+3*DAY;this.write(o);return true}
};

const RC={
  born(){let b=LS.get('dsc_born',0);if(!b){b=Date.now();LS.set('dsc_born',b)}return b},
  ageDays(){return Math.floor((Date.now()-this.born())/DAY)},
  freeDays(){const b=this.read().blockDays;return (b===undefined||b===null)?30:b},
  trialLeft(){return Math.max(0,this.freeDays()-this.ageDays())},
  read(){return LS.get('dsc_cfg2',{mode:'free',blockDays:30,notice:'',noticeId:0,link:'',linkText:'',minVer:'',apkUrl:'',ping:'',issue:-1})},
  mode(){return this.read().mode||'free'},
  async fetch(){
    try{
      const r=await fetch(CONFIG_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
      const txt=await r.text();const m=txt.match(/DSCFG2\.([A-Za-z0-9\-_]+)\.([A-Za-z0-9\-_]+)/);if(!m)return;
      const jb=Uint8Array.from(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
      const sig=Uint8Array.from(atob(m[2].replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
      if(sig.length!==64||!await LIC.verify(jb,sig))return;
      const j=JSON.parse(new TextDecoder().decode(jb));const cur=this.read();
      if((j.issue||0)>=(cur.issue||-1))LS.set('dsc_cfg2',Object.assign({mode:'free',blockDays:30,notice:'',noticeId:0,link:'',linkText:'',minVer:'',apkUrl:'',ping:'',issue:0},j));
    }catch(e){}
  },
  ping(){const cfg=this.read();if(!cfg.ping)return;try{fetch(cfg.ping+(cfg.ping.includes('?')?'&':'?')+'code='+encodeURIComponent(LIC.code)+'&v='+APP_VERSION+'&age='+this.ageDays(),{cache:'no-store',mode:'no-cors'})}catch(e){}}
};

const BLE={log:[],waiters:[],busy:Promise.resolve(),pz:0,pzReadyAt:0,pzWait:[],fails:0,lastCmdAt:0};
function dlog(m){BLE.log.push(new Date().toLocaleTimeString()+'  '+m);if(BLE.log.length>300)BLE.log.splice(0,50)}
function handleData(v){
  if(v[0]===0x50&&v[1]===0x5a){ // "PZ": sinal do módulo. bit5=1 e bit3=0 => livre p/ receber comando
    BLE.pz++;const b=v[3];const ready=((b>>5)&1)===1&&((b>>3)&1)===0;
    if(BLE.pz===1||b!==BLE.pzLast)dlog('PZ estado '+b.toString(2).padStart(8,'0')+' livre='+ready);BLE.pzLast=b;
    if(ready){BLE.pzReadyAt=Date.now();const w=BLE.pzWait.splice(0);w.forEach(f=>f(true))}
    return;
  }
  if(v[0]!==0x41){dlog('← '+hex(v));return}
  if(v[1]!==88&&v[1]!==89)dlog('← '+hex(v));
  const w=BLE.waiters.findIndex(x=>x.code===v[1]);
  if(w>=0){BLE.waiters.splice(w,1)[0].res(v)}
}
// espera o aparelho avisar que está livre (igual ao app oficial)
function waitReady(ms){
  if(Date.now()-BLE.pzReadyAt<250)return Promise.resolve(true);
  return new Promise(res=>{const f=ok=>res(ok);BLE.pzWait.push(f);setTimeout(()=>{const i=BLE.pzWait.indexOf(f);if(i>=0){BLE.pzWait.splice(i,1);res(false)}},ms)});
}
function rawWrite(bytes){ if(NATIVE)window.AndroidBLE.write(hex(bytes).replace(/ /g,'')); }
function enqueue(fn){const p=BLE.busy.then(fn,fn);BLE.busy=p.catch(()=>{});return p}
// comandos (S/C/P): esperam o "livre" antes de enviar
function send(bytes,label){
  if(S.mode==='demo'){return Promise.resolve()}
  if(S.mode!=='ble')return Promise.resolve();
  return enqueue(async()=>{
    const ok=await waitReady(2500);
    dlog('→ '+(label?label+' ':'')+hex(bytes)+(ok?'':' (sem sinal livre)'));
    rawWrite(bytes);BLE.lastCmdAt=Date.now();
    await sleep(120);
  });
}
// perguntas (R): resposta 'A'+letra
function ask(letter,idx,timeout=700,tries=2){
  if(S.mode!=='ble')return Promise.reject('off');
  const code=RESP[letter];
  return enqueue(async()=>{
    for(let t=0;t<tries;t++){
      const p=new Promise((res,rej)=>{const w={code,res};BLE.waiters.push(w);setTimeout(()=>{const i=BLE.waiters.indexOf(w);if(i>=0){BLE.waiters.splice(i,1);rej('timeout')}},timeout)});
      rawWrite(req(letter,idx));
      try{return await p}catch(e){await sleep(60)}
    }
    throw 'sem resposta';
  });
}

/* ---------- status ---------- */
async function pollStatus(force,quiet){
  if(S.mode==='demo')return;
  if(S.mode!=='ble'||BLE.polling)return;
  if(!force&&BLE.fails>=6)return;
  BLE.polling=true;
  try{
    const v=await ask('A',null,900,force?2:1);BLE.fails=0;BLE.gotStatus=true;
    const u16=i=>(v[i]<<8)|v[i+1];
    const prev=S.status.index;
    S.status={index:u16(2),total:u16(4),dir:u16(6),dirs:u16(8),pmode:v[10]};
    if(prev!==S.status.index&&prev!==-1&&!quiet)onTrackChanged(prev,S.status.index);
    if(prev!==S.status.index){S.playing=true;renderLive()}
  }catch(e){BLE.fails++;if(BLE.fails===6)dlog('status: sem resposta, pausando consultas')}
  finally{BLE.polling=false}
}
setInterval(()=>pollStatus(),2500);
const fmt=s=>s==null||isNaN(s)?'--:--':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
async function pollTime(){
  if(S.mode!=='ble'||!S.playing||BLE.timeBusy)return;
  if(S.scan&&S.scan.running&&Math.random()<.7)return;
  BLE.timeBusy=true;
  try{const v=await ask('2',null,800,1);const full=(v[2]<<8)|v[3],cur=(v[4]<<8)|v[5];
    if(full>0&&full<36000)S.time={full,cur,at:Date.now(),idx:S.status.index};paintTime()}catch(e){}
  finally{BLE.timeBusy=false}
}
setInterval(pollTime,1000);
setInterval(()=>{if(S.mode==='demo'&&S.playing){S.time=S.time&&S.time.idx===S.status.index?S.time:{full:200+S.status.index*7,cur:0,at:Date.now(),idx:S.status.index};S.time.cur=Math.min(S.time.full,S.time.cur+1);paintTime()}},1000);
function paintTime(){

/* ================= AÇÕES ================= */
function act(a){
  if(a==='toggle')a=S.playing?'pause':'play';
  if(a==='play')S.playing=true;
  if(a==='pause')S.playing=false;
  if(a==='next'){ if(S.upnext.length)return playIndex(S.upnext.shift(),'fila'); if(S.queue)return queueStep(1); }
  if(a==='prev'&&S.queue)return queueStep(-1);
  if(['next','prev','fnext','fprev'].includes(a))S.playing=true;
  S.expect={at:Date.now()};
  if(S.mode==='demo')demoAct(a);else send(ASCII(CMD[a]),a);
  renderLive();
  setTimeout(()=>pollStatus(),1500);
}
const frameM=i=>{const b=upd('M');b[2]=(i>>8)&255;b[3]=i&255;return b};
// espera o aparelho confirmar que está na música i
async function waitIndex(i,ms){
  const end=Date.now()+ms;
  while(Date.now()<end){await sleep(650);await pollStatus(true,true);if(S.status.index===i)return true}
  return false;
}
let lastPlay={i:-1,at:0};
async function playIndex(i,why){
  if(lastPlay.i===i&&Date.now()-lastPlay.at<1500)return; // evita toque duplo mandar 2x
  lastPlay={i,at:Date.now()};
  S.playing=true;S.expect={at:Date.now()+20000,index:i};S.time=null;
  addRecent(i);renderLive();
  if(S.queue)S.queue.sentAt=Date.now();
  if(S.mode==='demo'){S.status.index=i;S.expect.at=Date.now();renderLive();return}
  if(S.mode!=='ble')return;
  const t=trackByIndex(i);const nm=t?cleanName(t.name):'#'+i;
  try{
    const cur=S.status.index;
    // vizinha: usa próxima/anterior do aparelho
    if(cur>0&&(i===cur+1||i===cur-1)){
      await send(ASCII(CMD[i>cur?'next':'prev']),(i>cur?'próxima':'anterior')+' → #'+i);
      if(await waitIndex(i,4500))return done();
    }
    const off=LS.get('dsp_moff',0);
    for(let n=0;n<2;n++){
      await send(frameM(i+off),'tocar #'+i+(n?' (de novo)':''));
      if(await waitIndex(i,4500))return done();
      dlog('aparelho não trocou p/ #'+i+' (ficou em #'+S.status.index+')');
    }
    // testa se o aparelho conta as músicas diferente
    for(const o of [-1,1]){
      if(o===off)continue;
      await send(frameM(i+o),'tocar #'+i+' teste contagem '+o);
      if(await waitIndex(i,4000)){LS.set('dsp_moff',o);dlog('contagem ajustada: '+o);return done()}
    }
    // última tentativa: se estiver perto, anda de uma em uma
    const d=i-S.status.index;
    if(S.status.index>0&&Math.abs(d)<=12){
      dlog('andando '+d+' faixas');
      for(let k=0;k<Math.abs(d);k++)await send(ASCII(CMD[d>0?'next':'prev']),d>0?'próxima':'anterior');
      if(await waitIndex(i,5000))return done();
    }
    toast('O aparelho não aceitou tocar "'+nm+'". Mande o diagnóstico.');dlog('FALHOU tocar #'+i);
  }finally{S.expect={at:Date.now(),index:i}}
  function done(){dlog('ok: tocando #'+i);S.expect={at:Date.now(),index:i};renderLive()}
}

}

/* ---------- troca de faixa: fila e playlist ---------- */
function onTrackChanged(prev,cur){
  addRecent(cur);
  const ours=S.expect&&(Date.now()-S.expect.at<5000||S.expect.index===cur);
  if(ours)return;
  // o aparelho trocou sozinho (música acabou): a fila manda
  if(S.upnext.length){playIndex(S.upnext.shift(),'fila');toast('Tocando a próxima da fila');return}
  if(S.queue){queueStep(1)}
}
function addRecent(i){const t=trackByIndex(i);if(!t)return;const k=tkey(t);S.recent=[k,...S.recent.filter(x=>x!==k)].slice(0,30);LS.set('dsp_recent',S.recent)}
function startPlaylist(id,shuffle,startPos=0){
  const pl=S.playlists.find(p=>p.id===id);if(!pl||!pl.items.length)return toast('Playlist vazia');
  let order=pl.items.map(k=>trackByKey(k)).filter(Boolean).map(t=>t.i);
  if(!order.length)return toast('As músicas dessa playlist não estão neste pendrive');
  if(shuffle){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}startPos=0}
  S.queue={plId:id,pos:startPos,order};
  if(S.pmode!==1)setPMode(1);
  playIndex(order[startPos]);toast('Playlist: '+pl.name);renderAll();
}
function queueStep(d){const q=S.queue;if(!q)return;q.pos=(q.pos+d+q.order.length)%q.order.length;playIndex(q.order[q.pos])}
function playNext(idxs,end){ // tocar a seguir / adicionar ao fim da fila
  idxs=idxs.filter(i=>i!=null);
  if(end)S.upnext.push(...idxs);else S.upnext.unshift(...idxs);
  toast(end?`${idxs.length} na fila`:'Vai tocar a seguir');renderLive();
}

/* ================= BIBLIOTECA ================= */
function trackByIndex(i){return S.lib?.tracks.find(t=>t.i===i)}
function trackByKey(k){if(typeof k==='number')return trackByIndex(k);if(/^#\d+$/.test(k))return trackByIndex(+k.slice(1));return S.lib?.tracks.find(t=>tkey(t)===k)}
function folderPath(f){ // caminho virtual: segue a organização que você fez
  if(!f)return [];
  const parts=f.split(/[\\/]+/).filter(Boolean);
  let top=parts[0],chain=[],seen=new Set();
  while(S.parent[top]&&!seen.has(top)){seen.add(top);chain.unshift(S.parent[top]);top=S.parent[top]}
  return [...chain,...parts];
}
function buildTree(){
  const root={name:'Pendrive',key:'',folders:{},tracks:[]};
  const ensure=path=>{let n=root;path.forEach((p,k)=>{n.folders[p]=n.folders[p]||{name:p,key:path.slice(0,k+1).join('/'),folders:{},tracks:[]};n=n.folders[p]});return n};
  Object.entries(S.parent).forEach(([c])=>ensure(folderPath(c)));
  (S.lib?.tracks||[]).forEach(t=>ensure(folderPath(t.folder)).tracks.push(t));
  return root;
}
const countDeep=n=>n.tracks.length+Object.values(n.folders).reduce((a,f)=>a+countDeep(f),0);
const allTracks=n=>[...n.tracks,...Object.values(n.folders).flatMap(allTracks)];
const hasIndex=(n,i)=>n.tracks.some(t=>t.i===i)||Object.values(n.folders).some(f=>hasIndex(f,i));
function autoGroupFolders(){
  const names=allFolderNames();let n=0;
  const seps=[/\s*[\\\/]\s*/,/\s+-\s+/,/\s*[|>]\s*/];
  names.forEach(f=>{for(const re of seps){const parts=f.split(re).filter(Boolean);
    if(parts.length>=2){const parent=parts[0].trim();if(parent&&parent!==f&&!S.parent[f]){S.parent[f]=parent;n++}break}}});
  save.parent();return n;
}
const allFolderNames=()=>[...new Set([...(S.lib?.tracks||[]).map(t=>t.folder).filter(Boolean),...Object.keys(S.parent),...Object.values(S.parent)])].sort((a,b)=>a.localeCompare(b,'pt',{numeric:true}));

/* ---------- leitura rápida do pendrive ----------
   - nome de cada música: 1 pergunta por música
   - pasta: pergunta só de 4 em 4 e confere os limites (as músicas da mesma pasta vêm juntas)
   - vai mostrando enquanto carrega, salva o progresso e continua de onde parou */
function startScanIfNeeded(){
  const total=S.status.total;if(!total)return;
  if(S.lib&&S.lib.total===total&&S.lib.done)return;
  if(!S.lib||S.lib.total!==total)S.lib={total,tracks:[],done:false,next:0,folderAt:{}};
  runScan();
}
async function runScan(force){
  if(S.mode!=='ble')return;
  if(force)S.lib={total:S.status.total,tracks:[],done:false,next:0,folderAt:{}};
  if(S.scan&&S.scan.running)return;
  const L=S.lib;L.folderAt=L.folderAt||{};
  S.scan={running:true,paused:false,t0:Date.now(),startAt:L.next};
  const total=L.total;
  const F=async i=>{if(i in L.folderAt)return L.folderAt[i];let f='';try{f=txt(await ask('Y',i,700,2))}catch(e){f=null}if(f==='/')f='';L.folderAt[i]=f;return f};
  const fill=async(a,b)=>{ // descobre a pasta de a..b
    const fa=await F(a),fb=await F(b);
    if(b-a<=1)return;
    if(fa===fb&&fa!==null){for(let k=a+1;k<b;k++)L.folderAt[k]=fa;return}
    const m=(a+b)>>1;await fill(a,m);await fill(m,b);
  };
  const STEP=4;let chunks=0;
  try{
    let i=L.next;
    while(i<=total){
      if(!S.scan||S.scan.paused||S.mode!=='ble')break;
      const j=Math.min(i+STEP-1,total);
      for(let k=i;k<=j;k++){
        if(L.tracks.some(t=>t.i===k))continue;
        let name='';try{name=txt(await ask('X',k,700,2))}catch(e){}
        if(name&&name.toUpperCase()!=='UNKNOWN')L.tracks.push({i:k,name,folder:''});
      }
      await fill(i>0?i-1:i,j);
      L.tracks.forEach(t=>{if(t.i>=i&&t.i<=j&&L.folderAt[t.i]!=null)t.folder=L.folderAt[t.i]||''});
      L.next=j+1;i=j+1;
      S.scan.done=j;chunks++;
      if(chunks%5===0||j>=total){save.lib();renderScanBar();if(S.tab==='folders'&&!S.q)renderKeep()}
    }
  }catch(e){dlog('leitura interrompida: '+e)}
  if(L.next>total){L.done=true;delete L.folderAt;save.lib();toast(L.tracks.length+' músicas carregadas');}
  else save.lib();
  S.scan.running=false;if(L.done)S.scan=null;
  renderAll();
}
function renderScanBar(){const e=$('#scanbar');if(e)e.outerHTML=ScanBar()}
function ScanBar(){
  const s=S.scan,L=S.lib;
  if(!L||L.done)return '<div id="scanbar" class="hide"></div>';
  const pct=Math.round((s?.done||L.next||0)/Math.max(1,L.total)*100);
  const el=s&&s.running?(Date.now()-s.t0)/1000:0;const doneN=(s?.done||0)-(s?.startAt||0);
  const eta=s&&s.running&&doneN>8?Math.round(el/doneN*(L.total-s.done)):null;
  return `<div class="scanbar" id="scanbar">${s&&s.running?'<div class="spin"></div>':ic('folder','style="width:22px;height:22px;color:var(--acc)"')}
    <div class="t"><b>${s&&s.running?'Lendo o pendrive…':'Leitura pausada'}</b><small>${L.tracks.length} músicas • ${pct}%${eta!=null?' • falta ~'+(eta>90?Math.round(eta/60)+' min':eta+' s'):''} • já dá pra navegar e tocar</small><div class="progress"><i style="width:${pct}%"></i></div></div>
    ${s&&s.running?`<button class="btn2" data-do="scanpause">Pausar</button>`:`<button class="btn2" data-do="scanresume">Continuar</button>`}</div>`;
}

// busca capa na internet (iTunes) — precisa de internet no celular
function searchCover(term,cb){
  const d=sheet(`<h3>Buscar capa na internet</h3><input class="field" id="cq" value="${esc(term)}" placeholder="Artista, álbum ou música"><button class="btn2" style="width:100%;margin-bottom:12px" id="cgo">${ic('search')} Buscar</button><div class="artgrid" id="cres"><div class="note">Toque em Buscar</div></div>`);
  const go=()=>{
    const q=d.querySelector('#cq').value.trim();if(!q)return;
    const box=d.querySelector('#cres');box.innerHTML='<div class="spin"></div>';
    const name='cb'+Date.now();const sc=document.createElement('script');
    const to=setTimeout(()=>{box.innerHTML='<div class="note">Sem internet ou nada encontrado.</div>';cleanup()},9000);
    const cleanup=()=>{delete window[name];sc.remove()};
    window[name]=r=>{clearTimeout(to);cleanup();
      const arts=[...new Set((r.results||[]).map(x=>(x.artworkUrl100||'').replace('100x100','600x600')).filter(Boolean))].slice(0,12);
      box.innerHTML=arts.length?arts.map(u=>`<button data-u="${esc(u)}"><img src="${esc(u)}"></button>`).join(''):'<div class="note">Nada encontrado. Tente outro nome.</div>';
      box.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{toast('Salvando capa…');const data=await resizeImg(b.dataset.u);closeSheet();cb(data)});
    };
    sc.onerror=()=>{clearTimeout(to);box.innerHTML='<div class="note">Sem internet agora.</div>';cleanup()};
    sc.src='https://itunes.apple.com/search?media=music&entity=album&limit=12&country=BR&term='+encodeURIComponent(q)+'&callback='+name;
    document.body.appendChild(sc);
  };
  d.querySelector('#cgo').onclick=go;go();
}

   <p class="note" style="margin-top:8px">Valor na mesma unidade do app oficial. Use "Ler do aparelho" para ver o que está gravado.</p></div>`;

function EqXover(){
  return EQCH.map(([c,n])=>{const x=S.xo[c]||{};return `<div class="card"><div class="label"><span>Crossover ${n}</span>${x.read?'<span class="pill">lido do aparelho</span>':''}</div>
    <div class="sw"><span><b>Passa-alta</b><small class="note" style="display:block">corta abaixo de</small></span>${stepper('h'+c,x.hpf,' Hz')}</div>
    <div class="sw"><span><b>Passa-baixa</b><small class="note" style="display:block">corta acima de</small></span>${stepper('l'+c,x.lpf,' Hz')}</div></div>`}).join('')+
   `<div class="card"><button class="btn2" style="width:100%" data-do="readaudio">${ic('refresh')} Ler valores do aparelho</button><p class="note" style="margin-top:10px">O crossover só é enviado quando os dois valores (passa-alta e passa-baixa) estiverem definidos. Os botões andam pelas frequências padrão.</p></div>`;
}
function sendGain(c,v){S.gain[c]=v;LS.set('dsp_gain',S.gain);clearTimeout(eqT['g'+c]);eqT['g'+c]=setTimeout(()=>{const b=upd('I');b[1]=c.charCodeAt(0);b[2]=v;send(b,'ganho '+c)},250)}
function sendPhase(c,inv){S.phase[c]=inv;LS.set('dsp_phase',S.phase);const b=upd('H');b[1]=c.charCodeAt(0);b[2]=inv?1:0;send(b,'fase '+c)}
function sendDelay(c,v){S.delay[c]=v;LS.set('dsp_delay',S.delay);clearTimeout(eqT['d'+c]);eqT['d'+c]=setTimeout(()=>{const b=upd('K');b[1]=c.charCodeAt(0);b[2]=(v>>8)&255;b[3]=v&255;send(b,'delay '+c)},300)}
function sendXo(c){const x=S.xo[c];LS.set('dsp_xo',S.xo);if(x.hpf==null||x.lpf==null)return toast('Defina passa-alta e passa-baixa');clearTimeout(eqT['x'+c]);eqT['x'+c]=setTimeout(()=>{const b=upd('X');b[1]=c.charCodeAt(0);b[2]=(x.hpf>>8)&255;b[3]=x.hpf&255;b[4]=(x.lpf>>8)&255;b[5]=x.lpf&255;send(b,'crossover '+c)},300)}
function stepVal(id,d){
  const kind=id[0],c=id.slice(1);
  if(kind==='d'){const v=Math.max(0,Math.min(9999,(S.delay[c]??0)+d));sendDelay(c,v);return renderKeep()}
  const x=S.xo[c]=S.xo[c]||{};const list=kind==='h'?XO_HPF:XO_LPF;const key=kind==='h'?'hpf':'lpf';
  let cur=x[key];let pos=cur==null?(kind==='h'?0:list.length-1):list.findIndex(f=>f>=cur);if(pos<0)pos=list.length-1;
  const stepN=Math.abs(d)>=10?3:1;pos=Math.max(0,Math.min(list.length-1,pos+(d>0?stepN:-stepN)));
  if(cur==null)pos=kind==='h'?0:list.length-1;
  x[key]=list[pos];
  if(x.hpf!=null&&x.lpf!=null&&x.hpf>=x.lpf){toast('Passa-alta precisa ser menor que a passa-baixa');x[key]=cur;return}
  sendXo(c);renderKeep();
}
async function readAudio(){
  if(S.mode!=='ble')return toast('Conecte primeiro');
  toast('Lendo ajustes…');
  try{const v=await ask('Q',null,1200,2);dlog('ganho lido: '+hex(v));CHS.forEach(([c],k)=>{if(v[2+k]!=null&&v[2+k]<=100)S.gain[c]=v[2+k]});LS.set('dsp_gain',S.gain)}catch(e){dlog('ganho: sem resposta')}
  try{const v=await ask('T',null,1200,2);dlog('delay lido: '+hex(v));CHS.forEach(([c],k)=>{const p=2+k*2;if(v[p+1]!=null)S.delay[c]=(v[p]<<8)|v[p+1]});LS.set('dsp_delay',S.delay)}catch(e){dlog('delay: sem resposta')}
  for(const [c,l] of [['A','j'],['C','k'],['E','l']]){
    try{const v=await ask(l,null,1200,2);dlog('crossover '+c+' lido: '+hex(v));const h=(v[2]<<8)|v[3],lp=(v[4]<<8)|v[5];if(h>=10&&h<=22000&&lp>=10&&lp<=22000){S.xo[c]={hpf:h,lpf:lp,read:true}}}catch(e){dlog('crossover '+c+': sem resposta')}
  }
  LS.set('dsp_xo',S.xo);toast('Ajustes lidos');if(S.tab==='eq')renderKeep();
}
function curve(b){const pts=b.map((v,k)=>[25+k*50,35-v*2.6]);let d=`M0 ${pts[0][1]} `;pts.forEach(([x,y],k)=>{if(k===0){d+=`L${x} ${y} `;return}const [px,py]=pts[k-1];const cx=(px+x)/2;d+=`C${cx} ${py} ${cx} ${y} ${x} ${y} `});d+=`L300 ${pts[5][1]}`;
  return `<defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#ff3346"/><stop offset="1" stop-color="#ff7a45"/></linearGradient></defs><line x1="0" y1="35" x2="300" y2="35" stroke="#ffffff22" stroke-dasharray="4 4"/><path d="${d}" fill="none" stroke="url(#g1)" stroke-width="3" stroke-linecap="round"/>`}
const eqT={};
function sendEq(ch){
  clearTimeout(eqT[ch]);eqT[ch]=setTimeout(()=>{const st=eqState(ch);const b=upd('E');const pos=[1,2,3,4,5,7];st.bands.forEach((v,k)=>b[pos[k]]=Math.max(0,Math.min(24,v+12)));b[13]=ch.charCodeAt(0);send(b,'EQ '+ch)},300);
  save.eq();
}
function setupEqSliders(root){
  root.querySelectorAll('.vslide').forEach(el=>{
    const k=+el.dataset.band;
    const paint=()=>{const v=eqState(S.eqCh).bands[k];const h=el.clientHeight;const y=h/2-v/12*(h/2-15);el.querySelector('.knob').style.top=y+'px';const f=el.querySelector('.fill');f.style.top=Math.min(y,h/2)+'px';f.style.height=Math.abs(y-h/2)+'px';const bv=$('#bv'+k);if(bv)bv.textContent=(v>0?'+':'')+v};
    paint();
    const setFrom=e=>{const r=el.getBoundingClientRect();const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;let v=Math.round((r.height/2-y)/(r.height/2-15)*12);v=Math.max(-12,Math.min(12,v));const st=eqState(S.eqCh);if(st.bands[k]!==v){st.bands[k]=v;st.preset=-1;paint();$('#eqcurve').innerHTML=curve(st.bands);sendEq(S.eqCh)}};
    const up=()=>{window.removeEventListener('pointermove',setFrom);window.removeEventListener('pointerup',up);renderKeep()};
    el.addEventListener('pointerdown',e=>{e.preventDefault();setFrom(e);window.addEventListener('pointermove',setFrom);window.addEventListener('pointerup',up)});
  });
}

function volCard(){const p=Math.round(S.volume/50*100);return `<div class="card"><div class="label">Volume geral</div><div class="vol">${ic('vol')}<input type="range" class="volr" min="0" max="50" value="${S.volume}" style="--p:${p}%"><span class="num volN">${S.volume}</span></div></div>`}
function modeCard(){return `<div class="card"><div class="label">Modo de reprodução</div><div class="seg">${MODES.map(([m,n,i])=>`<button class="${S.pmode===m?'on':''}" data-pm="${m}">${ic(i)}${n}</button>`).join('')}</div></div>`}
const APPS=[['Spotify','#1DB954','https://open.spotify.com'],['YT Music','#FF0000','https://music.youtube.com'],['Deezer','#A238FF','https://www.deezer.com'],['SoundCloud','#FF5500','https://soundcloud.com'],['Amazon','#25D1DA','https://music.amazon.com']];
function BtScreen(){
  return `<div class="card"><div class="label">Acesso rápido aos apps de música</div>
    <div class="appsrow">${APPS.map(a=>`<button class="appbtn" data-openapp="${a[2]}"><span class="ab" style="--c:${a[1]}">${ic('music')}</span><small>${a[0]}</small></button>`).join('')}</div>
    <p class="note" style="margin-top:12px">No modo Bluetooth o som vem do celular. Use os botões abaixo para tocar/pausar e os apps acima para escolher a música.</p></div>
   ${volCard()}
   <div class="card"><div class="label">Controles</div><div class="mini-transport" style="justify-content:center;gap:24px"><button class="tb" data-act="prev">${ic('prev')}</button><button class="tb big" data-act="toggle">${ic(S.playing?'pause':'play')}</button><button class="tb" data-act="next">${ic('next')}</button></div></div>`;
}
function RcaScreen(){
  const s0=S.sens?.g0??100,s1=S.sens?.g1??100,link=!!S.sens?.link;
  const row=(id,lbl,v)=>`<div class="sw" style="flex-direction:column;align-items:stretch;gap:8px"><b>${lbl}</b><div class="vol"><input type="range" class="sensr" data-sens="${id}" min="0" max="100" value="${v}" style="--p:${v}%"><span class="num" id="sv${id}">${v}%</span></div></div>`;
  return `${volCard()}
   <div class="card"><div class="label">Sensibilidade de entrada RCA</div>
     ${row('0','CH1 / CH2',s0)}
     <button class="linkbtn ${link?'on':''}" data-linksens="1">${ic('refresh')} ${link?'Canais ligados (mexe nos dois juntos)':'Ligar CH1/CH2 e CH3/CH4'}</button>
     ${row('1','CH3 / CH4',s1)}
     <p class="note" style="margin-top:8px">Ajuste quando a entrada RCA estiver muito baixa ou distorcendo. 100% = máximo.</p>
   </div>`;
}
function Home(){
  if(S.mode==='off')return ConnectCard()+(S.lib?.tracks?.length?Shortcuts():'');
  if(S.source==='4')return `${licBanner()}${srcCard()}${BtScreen()}`;
  if(S.source==='7')return `${licBanner()}${srcCard()}${RcaScreen()}`;
  return `${licBanner()}${NowCard()}${ScanBar()}${srcCard()}${modeCard()}${UpNext()}${Shortcuts()}`;
}
function Shortcuts(){
  const favs=S.favs.map(trackByKey).filter(Boolean);
  const rec=S.recent.map(trackByKey).filter(Boolean).slice(0,6);
  return `${favs.length?`<div class="sect"><b>Favoritas</b><button data-do="playfavs">Tocar</button></div>${favs.slice(0,6).map(t=>TrackRow(t,true)).join('')}`:''}
   ${rec.length?`<div class="sect"><b>Tocadas recentemente</b></div>${rec.map(t=>TrackRow(t,true)).join('')}`:''}`;
}
function Folders(){
  if(!S.lib||!S.lib.tracks.length)return `${licBanner()}${ScanBar()}<div class="empty">${ic('folder')}<div>Nenhuma música carregada ainda.</div><br>
    ${S.mode==='ble'?`<button class="bigbtn" data-do="scan">${ic('refresh')} Ler o pendrive</button>`:`<button class="bigbtn" data-do="connect">${ic('bt')} Conectar</button>`}</div>`;
  const tools=`<div class="toolbar"><label class="search">${ic('search')}<input id="q" placeholder="Buscar música ou pasta" value="${esc(S.q)}"></label>
    <button class="ib" data-do="view">${ic(S.view==='grid'?'rows':'grid')}</button><button class="ib" data-do="sort">${ic('sort')}</button></div>`;
  if(S.q.trim()){
    const q=S.q.trim().toLowerCase();
    const fs=allFolderNames().filter(f=>f.toLowerCase().includes(q)).slice(0,24);
    const res=S.lib.tracks.filter(t=>(t.name+' '+t.folder).toLowerCase().includes(q)).slice(0,300);
    return tools+(fs.length?`<div class="sect"><b>Pastas</b></div>${fs.map(f=>`<button class="plc" data-jump="${esc(f)}">${coverHTML(IDB.mem['f:'+f],f,'','',null)}<span style="flex:1"><b>${esc(f)}</b><small>${esc(folderPath(f).join(' › '))}</small></span>${ic('chev','style="width:18px;height:18px;color:var(--dim)"')}</button>`).join('')}`:'')+
      `<div class="sect"><b>${res.length} música(s)</b></div>`+(res.map(t=>TrackRow(t,true)).join('')||'<div class="empty">Nada encontrado</div>');
  }
  const n=curNode(),path=S.nav.path;
  const orgBtn=!path.length?`<div class="card" style="display:flex;gap:12px;align-items:center;padding:12px 14px"><div style="flex:1;min-width:0"><b style="font-size:13px">Organizar pastas automaticamente</b><div class="note">Agrupa pastas que tenham o nome do grupo (ex.: "FORRÓ - Banda X" vira Banda X dentro de FORRÓ).</div></div><button class="btn2" data-do="autogroup">${ic('move')} Organizar</button></div>`:'';
  const crumbs=`<div class="crumbs">${path.length?`<button class="back" data-do="up">${ic('back')}Voltar</button>`:''}
    <button class="crumb ${path.length?'':'cur'}" data-go="0">Pendrive</button>
    ${path.map((p,k)=>`<span style="color:#444">›</span><button class="crumb ${k===path.length-1?'cur':''}" data-go="${k+1}">${esc(p)}</button>`).join('')}</div>`;
  const folders=sortItems(Object.values(n.folders),f=>f.name);
  const tracks=sortItems(n.tracks,t=>cleanName(t.name));
  const sortLbl={az:'A → Z',za:'Z → A',pd:'Pendrive'}[S.sort];
  const head=path.length?`<div class="card" style="display:flex;gap:14px;align-items:center">${coverHTML(coverOfFolder(n),n.name,'','width:84px;height:84px',null)}
     <div style="flex:1;min-width:0"><b style="font-size:18px;display:block;word-break:break-word">${esc(n.name)}</b><small class="note">${countDeep(n)} músicas</small>
     <div class="row2" style="margin-top:10px"><button class="btn2" data-do="playfolder">${ic('play')} Tocar</button><button class="btn2" data-fmenu="${esc(n.name)}">${ic('more')}</button></div></div></div>`:'';
  return ScanBar()+tools+orgBtn+crumbs+head+
   (folders.length?`<div class="sect"><b>Pastas</b><span class="note">${sortLbl}</span></div><div class="${S.view==='grid'?'fgrid':'flist'}">${folders.map(FolderCard).join('')}</div>`:'')+
   (tracks.length?`<div class="sect"><b>Músicas</b></div>${tracks.map(t=>TrackRow(t)).join('')}`:'')+
   (!folders.length&&!tracks.length?'<div class="empty">Pasta vazia</div>':'');
}
function Library(){
  if(S.openPl){
    const pl=S.playlists.find(p=>p.id===S.openPl);if(!pl){S.openPl=null;return Library()}
    const on=S.queue?.plId===pl.id;const cov=IDB.mem['p:'+pl.id]||pl.items.map(k=>coverOf(trackByKey(k))).find(Boolean);
    return `<div class="crumbs"><button class="back" data-do="plback">${ic('back')}Biblioteca</button></div>
    <div class="card" style="display:flex;gap:16px;align-items:center">${coverHTML(cov,pl.name,'','width:104px;height:104px','list')}
      <div style="flex:1;min-width:0"><b style="font-size:20px;display:block;word-break:break-word">${esc(pl.name)}</b><small class="note">${pl.items.length} músicas</small>
      <div class="row2" style="margin-top:12px"><button class="bigbtn" data-plplay="0" style="padding:12px">${ic('play')} Tocar</button><button class="btn2" data-plshuf="1">${ic('shuf')}</button><button class="btn2" data-do="plmenu">${ic('more')}</button></div></div></div>
    ${on?`<button class="ghost" data-do="stopq" style="margin-bottom:12px">${ic('x')} Parar playlist</button>`:''}
    ${pl.items.length?pl.items.map((k,n)=>{const t=trackByKey(k);const nm=t?t.name:String(k).split('|').pop();const cur=on&&t&&S.queue.order[S.queue.pos]===t.i;
      return `<div class="trk ${cur?'playing':''}" ${t?`data-i="${t.i}"`:''}><button data-plplay="${n}">${coverHTML(coverOf(t),nm)}</button>
        <button class="tt" data-plplay="${n}"><b>${esc(cleanName(nm))}</b><small>${t?esc(t.folder||'Raiz'):'Fora deste pendrive'}</small></button>
        <button class="mini-b" data-mv="${n}:-1">${ic('up')}</button><button class="mini-b" data-mv="${n}:1">${ic('dn')}</button><button class="mini-b" data-rm="${n}">${ic('x')}</button></div>`}).join('')
     :`<div class="empty">${ic('music')}<div>Playlist vazia.<br>Nas Pastas, toque em ⋮ numa música → Adicionar à playlist.</div></div>`}`;
  }
  const seg=`<div class="seg" style="margin-bottom:16px">${[['playlists','Playlists'],['favs','Favoritas'],['hist','Histórico']].map(([k,n])=>`<button class="${S.libTab===k?'on':''}" data-libtab="${k}">${n}</button>`).join('')}</div>`;
  let body;
  if(S.libTab==='favs'){const favs=S.favs.map(trackByKey).filter(Boolean);
    body=favs.length?`<div class="sect"><b>${favs.length} favoritas</b><button data-do="playfavs">Tocar todas</button></div>${favs.map(t=>TrackRow(t,true)).join('')}`:`<div class="empty">${ic('heart')}<div>Nenhuma favorita.<br>Toque no coração de uma música.</div></div>`;
  }else if(S.libTab==='hist'){const rec=S.recent.map(trackByKey).filter(Boolean);
    body=rec.length?`<div class="sect"><b>Tocadas recentemente</b><button data-do="clearhist">Limpar</button></div>${rec.map(t=>TrackRow(t,true)).join('')}`:`<div class="empty">${ic('clock')}<div>Seu histórico aparece aqui.</div></div>`;
  }else{
    body=`<button class="bigbtn" data-do="plnew" style="margin-bottom:14px">${ic('plus')} Nova playlist</button>
     ${S.favs.length?`<button class="plc" data-do="playfavs"><div class="cover" style="width:60px;height:60px;background:var(--grad);color:#fff">${ic('heartf')}</div><span style="flex:1"><b>Favoritas</b><small>${S.favs.length} músicas</small></span>${ic('play','style="width:20px;height:20px;color:var(--acc)"')}</button>`:''}
     ${S.playlists.length?S.playlists.map(p=>{const cov=IDB.mem['p:'+p.id]||p.items.map(k=>coverOf(trackByKey(k))).find(Boolean);return `<button class="plc ${S.queue?.plId===p.id?'active':''}" data-plopen="${p.id}">${coverHTML(cov,p.name,'','','list')}<span style="flex:1"><b>${esc(p.name)}</b><small>${p.items.length} músicas${S.queue?.plId===p.id?' · tocando':''}</small></span>${ic('chev','style="width:18px;height:18px;color:var(--dim)"')}</button>`}).join('')
     :`<div class="empty">${ic('lib')}<div>Nenhuma playlist ainda.</div></div>`}`;
  }
  return `<h1 class="title">Biblioteca</h1>${seg}${body}`;
}

  </div>
  <div class="card"><div class="label">Pendrive</div>

/* ================= LICENÇA: banner + tela ================= */
function licBanner(){
  if(!NATIVE)return '';const st=LIC.state();
  if(st==='active'){return LIC.leftDays()<=3?`<div class="licbanner warn">${ic('clock')}<span>Seu aluguel vence em ${LIC.leftDays()>1?LIC.leftDays()+' dias':LIC.leftHours()+' h'}. <b data-do="activate" style="color:#ffd98a;text-decoration:underline">Renovar</b></span></div>`:'';}
  const left=RC.trialLeft();
  if(left>0)return `<div class="licbanner warn">${ic('clock')}<span>Teste grátis: faltam <b>${left} dia(s)</b>. <b data-do="activate" style="color:#ffd98a;text-decoration:underline">Ver planos</b></span></div>`;
  return '';
}
function setConn(){
  const c=$('#connBtn');c.className='hbtn '+(S.mode==='ble'?'on':S.mode==='demo'?'demo':'');$('#connTxt').textContent={off:'Conectar',ble:'Conectado',demo:'Demo'}[S.mode];
  const p=$('#pwrBtn');p.className='hbtn pwr '+(S.power?'on':'off')+(S.mode==='off'?' hide':'');p.innerHTML=ic('power');
}
$('#connBtn').onclick=()=>{S.mode==='off'?connect():go('settings')};
$('#pwrBtn').onclick=()=>{const on=!S.power;confirmSheet(on?'Ligar o aparelho?':'Desligar o aparelho?',on?'O DS Player vai ligar.':'O som vai parar.',on?'Ligar':'Desligar',()=>setPower(on))};
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{renderPanel();renderMini()},150)});

/* ---- ativação (folha) ---- */
function activateSheet(unlock){
  const st=LIC.state();
  const d=sheet(`<h3>${unlock?'Desbloquear aparelho':'Ativar DS Control'}</h3>
    <p>Mande seu <b>código do aparelho</b> para o @guucds e cole aqui a chave que ele enviar.</p>
    <div class="card" style="text-align:center;margin-bottom:12px"><small class="note">SEU CÓDIGO</small><div style="font-size:26px;font-weight:850;letter-spacing:2px;margin:4px 0">${LIC.codeFmt()}</div>
      <button class="pill" id="cpcode">${ic('copy','style="width:12px;height:12px;display:inline"')} Copiar código</button></div>
    <input class="field" id="lickey" placeholder="Cole a chave aqui (DSC1...)" autocapitalize="off" autocomplete="off">
    <button class="bigbtn" id="licok">${ic('check')} Ativar</button>
    <div class="label" style="margin-top:16px">Planos — toque para pedir</div>
    <div class="plans">${PLANS.map((p,i)=>`<button class="pl" data-plan="${i}"><b>${p[1]}</b><small>${p[0]}</small></button>`).join('')}</div>
    <div class="note" style="text-align:center;margin-top:8px">PIX <b>(99) 98400-3657</b></div>`);
  d.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>askPlan(+b.dataset.plan));
  d.querySelector('#cpcode').onclick=()=>{navigator.clipboard?.writeText(LIC.codeFmt());toast('Código copiado')};
  d.querySelector('#licok').onclick=async()=>{
    const r=await LIC.activate(d.querySelector('#lickey').value);
    toast(r.msg);
    if(r.ok){closeSheet();gateCheck();renderAll()}
  };
}
function askPlan(i){const p=PLANS[i];const msg='Olá @guucds! Quero o plano *'+p[0]+'* ('+p[1]+') do DS Control.\nMeu código do aparelho: '+LIC.codeFmt()+'\nVou pagar no PIX (99) 98400-3657.';window.open('https://wa.me/'+WHATS+'?text='+encodeURIComponent(msg),'_blank')}
/* ---- gate (overlay bloqueante) ---- */
function showUpdateGate(cfg){
  const g=$('#gate');g.className='on';
  g.innerHTML=`<div class="gin"><div class="glogo">${ic('dn')}</div><h2>Atualização disponível</h2>
    <div class="gsub">Saiu uma versão nova do DS Control. Baixe para continuar usando.</div>
    ${cfg.apkUrl?`<button class="bigbtn" id="updbtn">${ic('dn')} Baixar atualização</button>`:'<div class="note" style="text-align:center">Peça o app novo ao @guucds.</div>'}
    <div class="contact">Suporte <b>@guucds</b><br><a href="https://wa.me/${WHATS}">WhatsApp (99) 98400-3657</a></div></div>`;
  const u=g.querySelector('#updbtn');if(u)u.onclick=()=>{try{if(NATIVE&&window.AndroidBLE.openUrl)window.AndroidBLE.openUrl(cfg.apkUrl);else window.open(cfg.apkUrl,'_blank')}catch(e){window.open(cfg.apkUrl,'_blank')}};
}
function gateCheck(silent){
  const g=$('#gate');
  if(!NATIVE){g.className='';g.innerHTML='';return}   // navegador = prévia, sem bloqueio
  const _cfg=RC.read();
  // atualização obrigatória (quem tem internet é forçado a baixar a nova versão)
  if(_cfg.minVer&&cmpVer(APP_VERSION,_cfg.minVer)<0){ showUpdateGate(_cfg); return; }
  if(_cfg.mode!=='paid'){g.className='';g.innerHTML='';return}   // modo grátis = liberado p/ todos

  }else{

      <div class="gsub">${st==='expired'?'Renove para continuar usando.':'Alugue o app para controlar seu DS Player.'}</div>
      <div class="plans">${PLANS.map((p,i)=>`<button class="pl" data-plan="${i}"><b>${p[1]}</b><small>${p[0]}</small></button>`).join('')}</div>
      <div class="note" style="text-align:center;margin-bottom:12px">Toque no plano para pedir no WhatsApp. Pague no PIX <b>(99) 98400-3657</b> e receba a chave.</div>
      ${code}<input class="field" id="gk" placeholder="Cole a chave (DSC1...)" autocapitalize="off"><button class="bigbtn" id="gok">${ic('check')} Ativar</button>
      ${contact}</div>`;
  }
  g.querySelector('#gcp').onclick=()=>{navigator.clipboard?.writeText(LIC.codeFmt());toast('Código copiado')};
  g.querySelector('#gok').onclick=async()=>{const r=await LIC.activate(g.querySelector('#gk').value);toast(r.msg);if(r.ok){gateCheck();renderAll()}};

function bind(root){

  on('[data-tab2]',b=>go(b.dataset.tab2));

  on('[data-mv]',b=>{const[k,d]=b.dataset.mv.split(':').map(Number);const pl=S.playlists.find(p=>p.id===S.openPl);const j=k+d;if(j<0||j>=pl.items.length)return;[pl.items[k],pl.items[j]]=[pl.items[j],pl.items[k]];save.pl();renderKeep()});

  on('[data-eqch]',b=>{S.eqCh=b.dataset.eqch;renderKeep()});
  on('[data-eqtab]',b=>{S.eqTab=b.dataset.eqtab;renderKeep();if(['gain','delay','xover'].includes(S.eqTab)&&S.mode==='ble'&&!S._audioRead){S._audioRead=1;readAudio()}});
  on('[data-phase]',b=>{const[c,v]=b.dataset.phase.split(':');sendPhase(c,v==='1');renderKeep()});
  on('[data-step]',b=>{const[id,d]=b.dataset.step.split(':');stepVal(id,+d)});
  root.querySelectorAll('[data-gain]').forEach(r=>r.oninput=e=>{const v=+e.target.value;r.style.setProperty('--p',v+'%');const n=$('#gv'+r.dataset.gain);if(n)n.textContent=v;sendGain(r.dataset.gain,v)});
  on('[data-preset]',b=>{const k=+b.dataset.preset;const st=eqState(S.eqCh);st.preset=k;st.bands=[...PRESETS[k][1]];sendEq(S.eqCh);renderKeep()});
  on('[data-do]',b=>doAction(b.dataset.do));
  root.querySelectorAll('.volr').forEach(vol=>vol.oninput=e=>{const v=+e.target.value;document.querySelectorAll('.volN').forEach(n=>n.textContent=v);document.querySelectorAll('.volr').forEach(r=>{r.value=v;r.style.setProperty('--p',Math.round(v/50*100)+'%')});setVolume(v)});
  const q=root.querySelector('#q');if(q)q.oninput=e=>{S.q=e.target.value;const pos=q.selectionStart;renderKeep();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
  on('[data-open-player]',()=>openPlayer());
  on('[data-plan]',b=>askPlan(+b.dataset.plan));
  on('[data-openapp]',b=>{const u=b.dataset.openapp;try{if(NATIVE&&window.AndroidBLE.openUrl)window.AndroidBLE.openUrl(u);else window.open(u,'_blank')}catch(e){window.open(u,'_blank')}});
  on('[data-tgl]',b=>toggleSetting(b.dataset.tgl));

  on('[data-seek]',(b,e)=>{const r=b.getBoundingClientRect();const x=(e.clientX-r.left)/r.width;const cur=S.time?S.time.cur/S.time.full:0;if(Math.abs(x-cur)<0.02)return;act(x>cur?'fwd':'rew');if(!LS.get('dsp_seeknote',0)){LS.set('dsp_seeknote',1);toast('O DS Player avança/volta em saltos (não dá ponto exato)')}});

function findNode(name){let found=null;(function w(n){if(found)return;Object.values(n.folders).forEach(f=>{if(f.name===name)found=f;else w(f)})})(buildTree());return found}
function moveFolder(name){
  // não pode mover para dentro dela mesma ou de uma filha
  const isDesc=(c,a)=>{let x=c,seen=new Set();while(S.parent[x]&&!seen.has(x)){seen.add(x);if(S.parent[x]===a)return true;x=S.parent[x]}return false};
  const opts=allFolderNames().filter(f=>f!==name&&!isDesc(f,name));
  const d=sheet(`<h3>Mover "${esc(name)}" para dentro de…</h3><p>Isso só muda a organização no app. O pendrive não é alterado.</p>
    <label class="search" style="margin-bottom:10px">${ic('search')}<input id="mq" placeholder="Procurar pasta"></label>
    <div id="mlist">${opts.map(f=>`<button class="mi" data-to="${esc(f)}">${ic('folder')} ${esc(folderPath(f).join(' › '))}</button>`).join('')}</div>
    <button class="ghost" data-to="__new" style="margin-top:8px">${ic('plus')} Criar pasta nova e mover</button>`);
  const bindTo=()=>d.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>{
    const to=b.dataset.to;
    const done=t=>{S.parent[name]=t;save.parent();closeSheet();toast('"'+name+'" agora está dentro de '+t);if(S.nav.path.includes(name))S.nav.path=[];renderKeep();renderPanel()};
    if(to==='__new'){closeSheet();promptName('Nome da pasta nova','',n=>{done(n)},'Nome da pasta');return}
    done(to);
  });
  bindTo();
  d.querySelector('#mq').oninput=e=>{const q=e.target.value.toLowerCase();d.querySelectorAll('#mlist [data-to]').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'':'none')};
}

/* ================= DEMONSTRAÇÃO ================= */
function startDemo(){
  const data={'FUNK':['MC Exemplo - Faixa 1','MC Exemplo - Faixa 2','Montagem Paredão','Funk Automotivo 2026'],'HOUSE':['House Mix 01','House Mix 02','Deep Session'],'TECHNO':['Techno Drive','Pancadão Techno'],'ELETRONICA':['Set Eletrônico'],'PISEIRO':['Piseiro 01','Piseiro 02','Piseiro 03','Piseiro 04','Piseiro 05'],'SERTANEJO':['Sertanejo Ao Vivo 1','Sertanejo Ao Vivo 2'],'TESTE DE SOM':['Grave 30Hz','Grave 40Hz','Varredura 20-200Hz'],'':['Vinheta @guucds']};
  const tracks=[];let i=1;Object.entries(data).forEach(([f,arr])=>arr.forEach(n=>tracks.push({i:i++,name:n.toUpperCase()+'.MP3',folder:f})));
  S.lib={total:tracks.length,tracks,done:true,demo:true};
  if(!Object.keys(S.parent).length)S.parent={HOUSE:'ELETRONICA',TECHNO:'ELETRONICA'};
  S.mode='demo';S.status={index:3,total:tracks.length,dir:1,dirs:8,pmode:1};S.playing=true;
  toast('Demonstração: nada é enviado ao aparelho');renderAll();
}
function demoAct(a){
  const st=S.status,t=S.lib.tracks,k=t.findIndex(x=>x.i===st.index);
  if(a==='next')st.index=t[(k+1)%t.length].i;
  if(a==='prev')st.index=t[(k-1+t.length)%t.length].i;
  if(a==='fnext'||a==='fprev'){const f=t[k]?.folder;const d=a==='fnext'?1:-1;let j=k;do{j=(j+d+t.length)%t.length}while(t[j].folder===f&&j!==k);st.index=t[j].i}
  addRecent(st.index);
}
/* ---- fila (folha, usada no player) ---- */
function queueSheet(){
  if(!S.upnext.length)return toast('A fila está vazia');
  const d=sheet(`<h3>Próximas na fila</h3><p>${S.upnext.length} música(s)</p>`+
    S.upnext.map((i,k)=>{const t=trackByIndex(i)||{i,name:'Faixa '+i,folder:''};return `<div class="qrow"><span class="qn">${k+1}</span><div class="trk"><button data-qpl="${k}">${coverHTML(coverOf(t),t.name,'','width:40px;height:40px')}</button><button class="tt" data-qpl="${k}"><b>${esc(cleanName(t.name))}</b><small>${esc(t.folder||'Raiz')}</small></button></div><button class="mini-b" data-qx="${k}">${ic('x')}</button></div>`}).join('')+
    `<button class="ghost" id="qclr" style="margin-top:10px">${ic('trash')} Limpar fila</button>`);
  d.querySelectorAll('[data-qpl]').forEach(b=>b.onclick=()=>{const k=+b.dataset.qpl;const i=S.upnext.splice(k,1)[0];closeSheet();playIndex(i)});
  d.querySelectorAll('[data-qx]').forEach(b=>b.onclick=()=>{S.upnext.splice(+b.dataset.qx,1);closeSheet();queueSheet();renderLive()});
  d.querySelector('#qclr').onclick=()=>{S.upnext=[];closeSheet();renderLive()};
}

/* ================= BOOT ================= */
async function boot(){
  try{await IDB.open();await IDB.loadAll()}catch(e){}
  try{await LIC.init()}catch(e){}
  renderAll();
  try{await RC.fetch()}catch(e){}
  RC.ping();checkNotice();
  gateCheck();renderAll();
  if(NATIVE&&S.autoconn&&S.mode==='off'){setTimeout(()=>{try{window.AndroidBLE.autoConnect&&window.AndroidBLE.autoConnect()}catch(e){}},900)}
  setInterval(()=>{try{LIC.tick();gateCheck(true)}catch(e){}},60000);
  setInterval(()=>RC.ping(),120000);
  setInterval(()=>{RC.fetch().then(()=>{gateCheck(true);checkNotice()})},1800000);
}
boot();

</script>
