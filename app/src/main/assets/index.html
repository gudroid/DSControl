<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#09090c">
<title>DS Control</title>
<style>
:root{
  --bg:#09090c;--bg2:#101015;--card:#15151c;--card2:#1c1c25;--line:#26262f;--line2:#33333f;
  --txt:#f4f4f7;--sub:#a3a3b2;--muted:#6e6e7e;
  --acc:#ff3346;--acc2:#ff7a45;--accs:#ff334622;--ok:#2fe0a0;--warn:#ffb020;
  --r:20px;--rs:14px;
  --grad:linear-gradient(135deg,var(--acc),var(--acc2));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
svg{display:block}
.hide{display:none!important}
::-webkit-scrollbar{width:0;height:0}

/* ===== ESTRUTURA ===== */
#app{display:grid;height:100%;grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid #ffffff08;background:var(--bg)}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 6px 20px #ff334650}
.logo svg{width:20px;height:20px}
.brand{flex:1;min-width:0;line-height:1.15}
.brand b{font-size:16px;font-weight:800;letter-spacing:.2px}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.hbtn{height:40px;min-width:40px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.hbtn svg{width:18px;height:18px}
.hbtn .dot{width:8px;height:8px;border-radius:50%;background:#555}
.hbtn.on .dot{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.hbtn.demo .dot{background:var(--warn)}
.pwr.on{color:var(--ok);border-color:#2fe0a055}
.pwr.off{color:var(--acc);border-color:#ff334655}

#side{display:none}
#main{overflow-y:auto;overflow-x:hidden;padding:16px 16px 120px;scroll-behavior:auto;min-width:0}
.card,.np,.scanbar{min-width:0}
/* tempo da música */
.time{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.time .bar{flex:1;height:5px;border-radius:9px;background:#ffffff1a;overflow:hidden}
.time .bar i{display:block;height:100%;background:var(--grad);width:0;transition:width .9s linear}
#npPanel{display:none}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;background:#0c0c10f2;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10.5px;font-weight:700;color:var(--muted);border-radius:12px}
nav#tabs svg{width:23px;height:23px}
nav#tabs button.on{color:var(--txt)}
nav#tabs button.on svg{color:var(--acc)}

/* paisagem / tablet: barra lateral + painel tocando */
@media (min-width:880px){
  #app{grid-template-columns:220px 1fr 360px;grid-template-rows:auto 1fr}
  #side{display:flex;flex-direction:column;gap:4px;padding:14px 10px;border-right:1px solid #ffffff08;overflow-y:auto}
  #side button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-weight:700;font-size:14px;color:var(--sub);text-align:left}
  #side button svg{width:21px;height:21px}
  #side button.on{background:var(--card);color:var(--txt)}
  #side button.on svg{color:var(--acc)}
  #side .sep{height:1px;background:var(--line);margin:10px 6px}
  #side .slabel{font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--muted);padding:6px 14px;text-transform:uppercase}
  #main{padding:20px 22px 40px}
  #npPanel{display:block;border-left:1px solid #ffffff08;overflow-y:auto;overflow-x:hidden;padding:16px;min-width:0}
  #npPanel .np{padding:16px 14px}
  #npPanel .transport{gap:6px;justify-content:space-between}
  #npPanel .tb{width:48px;height:48px}#npPanel .tb.big{width:66px;height:66px}#npPanel .tb.sm{width:36px;height:36px}
  #npPanel .art{max-width:240px}
  nav#tabs,#mini{display:none!important}
  .homeNow{display:none}
}
@media (min-width:880px) and (max-width:1100px){#app{grid-template-columns:76px 1fr 330px}#side button span{display:none}#side button{justify-content:center}#side .slabel{display:none}}

/* ===== ELEMENTOS ===== */
h1.title{font-size:24px;font-weight:850;letter-spacing:-.3px;margin:2px 2px 14px}
h1.title small{display:block;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.sect{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px}
.sect button{font-size:12px;color:var(--acc);text-transform:none;letter-spacing:0;font-weight:700}
.note{font-size:12.5px;color:var(--sub);line-height:1.55}

/* capa */
.cover{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#2a2a36,#18181f);display:grid;place-items:center;flex:none;color:#ffffff55}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .ini{font-weight:900;color:#ffffffcc;letter-spacing:-.5px}
.cover svg{width:40%;height:40%;color:#ffffff8c}

/* tocando agora */
.np{position:relative;overflow:hidden;max-width:560px;margin-left:auto;margin-right:auto;border-radius:24px;border:1px solid var(--line);padding:18px;margin-bottom:14px;background:#141419}
.np .bgart{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.4);opacity:.45;transform:scale(1.1)}
.np .shade{position:absolute;inset:0;background:linear-gradient(180deg,#0b0b0f33,#0b0b0fdd 70%)}
.np>*:not(.bgart):not(.shade){position:relative}
.np .art{width:100%;aspect-ratio:1;max-width:300px;margin:4px auto 16px;border-radius:20px;box-shadow:0 20px 50px #000a}
.np .art .ini{font-size:56px}
.np .t{font-size:20px;font-weight:850;line-height:1.2;letter-spacing:-.2px;word-break:break-word;text-align:center}
.np .s{color:var(--sub);font-size:13px;margin-top:6px;text-align:center;font-weight:600}
.np .chips{justify-content:center;margin-top:12px}
.transport{display:flex;align-items:center;justify-content:center;gap:clamp(6px,3vw,16px);margin-top:16px}
.tb{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#ffffff10;flex:none;transition:transform .1s}
.tb:active{transform:scale(.9)}
.tb svg{width:24px;height:24px}
.tb.big{width:76px;height:76px;background:var(--grad);box-shadow:0 10px 30px #ff334670}
.tb.big svg{width:32px;height:32px}
.tb.sm{width:44px;height:44px;background:transparent;color:var(--sub)}
.tb.sm svg{width:21px;height:21px}
.tb.busy{opacity:.55}
.row-ctl{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.vol{display:flex;align-items:center;gap:12px;margin-top:16px}
.vol svg{width:20px;height:20px;color:var(--sub);flex:none}
.vol .num{min-width:30px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;flex:1;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--acc) var(--p,40%),#ffffff1a var(--p,40%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 12px #0009}
.pill{font-size:11px;font-weight:750;padding:5px 10px;border-radius:999px;background:#ffffff12;color:#dadae2;white-space:nowrap}
.pill.acc{background:var(--accs);color:#ff8994}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--sub)}
.chip svg{width:17px;height:17px}
.chip.on{background:var(--accs);border-color:var(--acc);color:#ffb0b7}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{padding:11px 6px;border-radius:10px;font-weight:750;font-size:13px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:5px}
.seg button svg{width:20px;height:20px}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px #ff334650}

/* listas */
.toolbar{display:flex;gap:8px;margin-bottom:12px;position:sticky;top:-16px;z-index:5;background:var(--bg);padding:8px 0}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;width:100%;background:none;border:0;outline:none;padding:12px 0;font-size:15px}
.ib{width:46px;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--sub)}
.ib svg{width:20px;height:20px}
.crumbs{display:flex;align-items:center;gap:6px;margin-bottom:6px;overflow-x:auto;white-space:nowrap}
.back{display:flex;align-items:center;gap:4px;padding:9px 14px 9px 9px;border-radius:12px;background:var(--grad);font-weight:800;font-size:13px;flex:none}
.back svg{width:18px;height:18px}
.crumb{padding:9px 11px;border-radius:10px;background:var(--card);font-size:13px;color:var(--sub);flex:none;font-weight:600}
.crumb.cur{color:var(--txt);font-weight:800}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.fcard{text-align:left;position:relative}
.fcard .cover{width:100%;aspect-ratio:1;border-radius:18px}
.fcard .cover .ini{font-size:34px}
.fcard b{display:block;font-size:14px;font-weight:750;margin-top:9px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.fcard small{color:var(--muted);font-size:12px;font-weight:600}
.fcard .more{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:10px;background:#000000aa;display:grid;place-items:center;backdrop-filter:blur(6px)}
.fcard .more svg{width:18px;height:18px}
.fcard .sub{position:absolute;left:8px;top:8px;font-size:10px;font-weight:800;padding:4px 7px;border-radius:8px;background:#000000aa}
.fcard.playing .cover{outline:3px solid var(--acc);outline-offset:-3px}
.flist .fcard{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.flist .fcard .cover{width:56px;border-radius:12px}
.flist .fcard .cover .ini{font-size:18px}
.flist .fcard b{margin-top:0}
.flist .fcard .more{position:static;background:none}
.flist .fcard .sub{display:none}
.trk{display:flex;align-items:center;gap:12px;padding:7px 4px 7px 6px;border-radius:14px;width:100%}
.trk:active{background:var(--card)}
.trk .cover{width:46px;height:46px;border-radius:11px}
.trk .cover .ini{font-size:14px}
.trk .tt{flex:1;min-width:0;text-align:left}
.trk .tt b{display:block;font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .tt small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-weight:600}
.trk.playing b{color:#ff8994}
.trk .eqi{display:none}
.trk.playing .eqi{display:flex}
.mini-b{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted);flex:none}
.mini-b svg{width:19px;height:19px}
.mini-b.on{color:var(--acc)}
.bars{display:flex;gap:2px;align-items:flex-end;height:14px;margin-right:4px}
.bars i{width:3px;background:var(--acc);border-radius:2px;animation:eq 1s infinite ease-in-out}
.bars i:nth-child(2){animation-delay:.25s}.bars i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.paused .bars i{animation:none;height:3px}

.bigbtn{width:100%;padding:15px;border-radius:16px;background:var(--grad);font-weight:800;font-size:15px;display:flex;gap:8px;justify-content:center;align-items:center;box-shadow:0 8px 24px #ff334650}
.bigbtn svg{width:20px;height:20px}
.btn2{padding:13px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:750;font-size:14px;display:flex;gap:8px;justify-content:center;align-items:center}
.btn2 svg{width:18px;height:18px}
.btn2.danger{color:#ff8994}
.ghost{width:100%;padding:14px;border-radius:16px;border:1px dashed var(--line2);color:var(--sub);font-weight:700;display:flex;gap:8px;justify-content:center;align-items:center}
.ghost svg{width:18px;height:18px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:14px;line-height:1.5}
.empty svg{width:56px;height:56px;color:#33333f;margin:0 auto 12px}
.plc{display:flex;align-items:center;gap:14px;padding:10px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;width:100%;text-align:left}
.plc .cover{width:62px;height:62px}
.plc b{display:block;font-size:15px;font-weight:750}
.plc small{color:var(--muted);font-size:12px;font-weight:600}
.plc.active{border-color:var(--acc)}
.qrow{display:flex;align-items:center;gap:10px;padding:6px 0;min-width:0}.qrow .trk{flex:1;min-width:0}
.qn{width:26px;text-align:center;color:var(--muted);font-weight:800;font-size:12px;flex:none}

/* EQ */
.eqwrap{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:6px 0 4px}
.band{display:flex;flex-direction:column;align-items:center;gap:8px}
.band .val{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--txt);min-height:16px}
.band .lbl{font-size:11px;color:var(--muted);font-weight:700}
.vslide{position:relative;height:220px;width:44px;display:flex;justify-content:center;touch-action:none}
.vslide .track{position:absolute;top:0;bottom:0;width:8px;border-radius:9px;background:#ffffff14}
.vslide .zero{position:absolute;left:4px;right:4px;top:50%;height:2px;background:#ffffff26}
.vslide .fill{position:absolute;width:8px;border-radius:9px;background:var(--grad)}
.vslide .knob{position:absolute;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 3px 14px #000a;transform:translateY(-50%);border:5px solid var(--acc)}
.eqcurve{width:100%;height:70px;margin-top:6px}

/* mini player */
#mini{position:fixed;left:10px;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:14;display:flex;align-items:center;gap:10px;background:#1b1b24f5;backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:18px;padding:7px 7px 7px 7px;box-shadow:0 14px 34px #000c}
#mini .cover{width:46px;height:46px;border-radius:11px}
#mini .cover .ini{font-size:14px}
#mini .t{flex:1;min-width:0}
#mini b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini small{color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#mini .tb{width:42px;height:42px}
#mini .tb svg{width:20px;height:20px}
#mini .tb.big{width:46px;height:46px;box-shadow:none}

/* banner de carregamento */
.scanbar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.scanbar .t{flex:1;min-width:0}
.scanbar b{font-size:13px}
.scanbar small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.progress{height:6px;border-radius:9px;background:#ffffff14;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--grad);width:0;transition:width .3s}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid #ffffff22;border-top-color:var(--acc);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* folhas */
.sheetbg{position:fixed;inset:0;background:#000b;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:0;animation:up .22s cubic-bezier(.2,.8,.2,1)}
@media (min-width:880px){.sheetbg{align-items:center}.sheet{border-radius:24px;border-bottom:1px solid var(--line)}}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 14px}
.sheet h3{font-size:18px;font-weight:850;margin-bottom:4px}
.sheet p{color:var(--sub);font-size:13px;margin-bottom:14px;line-height:1.5}
.sheet .head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.sheet .head .cover{width:56px;height:56px}
.sheet .head b{display:block;font-size:15px;word-break:break-word}
.sheet .head small{color:var(--muted);font-size:12px;font-weight:600}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:13px 6px;border-radius:12px;font-size:15px;font-weight:650;text-align:left}
.mi:active{background:var(--card)}
.mi svg{width:21px;height:21px;color:var(--sub)}
.mi.danger,.mi.danger svg{color:#ff8994}
.field{width:100%;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);outline:none;font-size:15px;margin-bottom:12px}
.artgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.artgrid button{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card)}
.artgrid img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 16px;border-radius:14px;font-size:13px;font-weight:750;z-index:60;box-shadow:0 8px 24px #0009;max-width:90vw;text-align:center}
.sw{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
.sw:last-child{border:0}
.sw b{font-weight:750}
pre.diag{white-space:pre-wrap;font-size:11px;background:#06060a;padding:12px;border-radius:12px;color:#c9c9d4;max-height:55vh;overflow:auto;font-family:ui-monospace,monospace}
.screen{animation:fade .16s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo" id="logo"></div>
    <div class="brand"><b>DS Control</b><small>Stetsom DS Player • by @guucds</small></div>
    <button class="hbtn pwr hide" id="pwrBtn" title="Liga/desliga"></button>
    <button class="hbtn" id="connBtn"><span class="dot"></span><span id="connTxt">Conectar</span></button>
  </header>
  <aside id="side"></aside>
  <main id="main"></main>
  <aside id="npPanel"></aside>
</div>
<div id="mini" class="hide"></div>
<nav id="tabs"></nav>
<input type="file" id="filePick" accept="image/*" class="hide">

<script>
/* ================= ÍCONES ================= */
const I={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

const BLE={log:[],waiters:[],busy:Promise.resolve(),pz:0,pzReadyAt:0,pzWait:[],fails:0,lastCmdAt:0};
function dlog(m){BLE.log.push(new Date().toLocaleTimeString()+'  '+m);if(BLE.log.length>300)BLE.log.splice(0,50)}
function handleData(v){
  if(v[0]===0x50&&v[1]===0x5a){ // "PZ": sinal do módulo. bit5=1 e bit3=0 => livre p/ receber comando
    BLE.pz++;const b=v[3];const ready=((b>>5)&1)===1&&((b>>3)&1)===0;
    if(BLE.pz===1||b!==BLE.pzLast)dlog('PZ estado '+b.toString(2).padStart(8,'0')+' livre='+ready);BLE.pzLast=b;
    if(ready){BLE.pzReadyAt=Date.now();const w=BLE.pzWait.splice(0);w.forEach(f=>f(true))}
    return;
  }
  if(v[0]!==0x41){dlog('← '+hex(v));return}
  if(v[1]!==88&&v[1]!==89)dlog('← '+hex(v));
  const w=BLE.waiters.findIndex(x=>x.code===v[1]);
  if(w>=0){BLE.waiters.splice(w,1)[0].res(v)}
}
// espera o aparelho avisar que está livre (igual ao app oficial)
function waitReady(ms){
  if(Date.now()-BLE.pzReadyAt<250)return Promise.resolve(true);
  return new Promise(res=>{const f=ok=>res(ok);BLE.pzWait.push(f);setTimeout(()=>{const i=BLE.pzWait.indexOf(f);if(i>=0){BLE.pzWait.splice(i,1);res(false)}},ms)});
}
function rawWrite(bytes){ if(NATIVE)window.AndroidBLE.write(hex(bytes).replace(/ /g,'')); }
function enqueue(fn){const p=BLE.busy.then(fn,fn);BLE.busy=p.catch(()=>{});return p}
// comandos (S/C/P): esperam o "livre" antes de enviar
function send(bytes,label){
  if(S.mode==='demo'){return Promise.resolve()}
  if(S.mode!=='ble')return Promise.resolve();
  return enqueue(async()=>{
    const ok=await waitReady(2500);
    dlog('→ '+(label?label+' ':'')+hex(bytes)+(ok?'':' (sem sinal livre)'));
    rawWrite(bytes);BLE.lastCmdAt=Date.now();
    await sleep(120);
  });
}
// perguntas (R): resposta 'A'+letra
function ask(letter,idx,timeout=700,tries=2){
  if(S.mode!=='ble')return Promise.reject('off');
  const code=RESP[letter];
  return enqueue(async()=>{
    for(let t=0;t<tries;t++){
      const p=new Promise((res,rej)=>{const w={code,res};BLE.waiters.push(w);setTimeout(()=>{const i=BLE.waiters.indexOf(w);if(i>=0){BLE.waiters.splice(i,1);rej('timeout')}},timeout)});
      rawWrite(req(letter,idx));
      try{return await p}catch(e){await sleep(60)}
    }
    throw 'sem resposta';
  });
}
const txt=(v,from=2)=>{let s='';for(let i=from;i<v.length;i++){if(v[i]===0)break;s+=String.fromCharCode(v[i])}return s.replace(/\s+$/,'').trim()};

/* ---------- status ---------- */
async function pollStatus(force,quiet){
  if(S.mode==='demo')return;
  if(S.mode!=='ble'||BLE.polling)return;
  if(!force&&BLE.fails>=6)return;
  BLE.polling=true;
  try{
    const v=await ask('A',null,900,force?2:1);BLE.fails=0;BLE.gotStatus=true;
    const u16=i=>(v[i]<<8)|v[i+1];
    const prev=S.status.index;
    S.status={index:u16(2),total:u16(4),dir:u16(6),dirs:u16(8),pmode:v[10]};
    if(prev!==S.status.index&&prev!==-1&&!quiet)onTrackChanged(prev,S.status.index);
    if(prev!==S.status.index){S.playing=true;renderLive()}
  }catch(e){BLE.fails++;if(BLE.fails===6)dlog('status: sem resposta, pausando consultas')}
  finally{BLE.polling=false}
}
setInterval(()=>pollStatus(),2500);
const fmt=s=>s==null||isNaN(s)?'--:--':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
async function pollTime(){
  if(S.mode!=='ble'||!S.playing||BLE.timeBusy)return;
  if(S.scan&&S.scan.running&&Math.random()<.7)return;
  BLE.timeBusy=true;
  try{const v=await ask('2',null,800,1);const full=(v[2]<<8)|v[3],cur=(v[4]<<8)|v[5];
    if(full>0&&full<36000)S.time={full,cur,at:Date.now(),idx:S.status.index};paintTime()}catch(e){}
  finally{BLE.timeBusy=false}
}

function paintTime(){
  const t=S.time&&S.time.idx===S.status.index?S.time:null;
  document.querySelectorAll('.time').forEach(el=>{
    el.querySelector('.tc').textContent=fmt(t?.cur);el.querySelector('.tf').textContent=fmt(t?.full);

}

function act(a){
  if(a==='toggle')a=S.playing?'pause':'play';
  if(a==='play')S.playing=true;
  if(a==='pause')S.playing=false;
  if(a==='next'){ if(S.upnext.length)return playIndex(S.upnext.shift(),'fila'); if(S.queue)return queueStep(1); }
  if(a==='prev'&&S.queue)return queueStep(-1);
  if(['next','prev','fnext','fprev'].includes(a))S.playing=true;
  S.expect={at:Date.now()};
  if(S.mode==='demo')demoAct(a);else send(ASCII(CMD[a]),a);
  renderLive();
  setTimeout(()=>pollStatus(),1500);
}
const frameM=i=>{const b=upd('M');b[2]=(i>>8)&255;b[3]=i&255;return b};

async function waitIndex(i,ms){
  const end=Date.now()+ms;
  while(Date.now()<end){await sleep(650);await pollStatus(true,true);if(S.status.index===i)return true}
  return false;
}
let lastPlay={i:-1,at:0};
async function playIndex(i,why){
  if(lastPlay.i===i&&Date.now()-lastPlay.at<1500)return; // evita toque duplo mandar 2x
  lastPlay={i,at:Date.now()};
  S.playing=true;S.expect={at:Date.now()+20000,index:i};S.time=null;
  addRecent(i);renderLive();
  if(S.queue)S.queue.sentAt=Date.now();
  if(S.mode==='demo'){S.status.index=i;S.expect.at=Date.now();renderLive();return}
  if(S.mode!=='ble')return;
  const t=trackByIndex(i);const nm=t?cleanName(t.name):'#'+i;
  try{
    const cur=S.status.index;
    // vizinha: usa próxima/anterior do aparelho
    if(cur>0&&(i===cur+1||i===cur-1)){
      await send(ASCII(CMD[i>cur?'next':'prev']),(i>cur?'próxima':'anterior')+' → #'+i);
      if(await waitIndex(i,4500))return done();
    }
    const off=LS.get('dsp_moff',0);
    for(let n=0;n<2;n++){
      await send(frameM(i+off),'tocar #'+i+(n?' (de novo)':''));
      if(await waitIndex(i,4500))return done();
      dlog('aparelho não trocou p/ #'+i+' (ficou em #'+S.status.index+')');
    }
    // testa se o aparelho conta as músicas diferente
    for(const o of [-1,1]){
      if(o===off)continue;
      await send(frameM(i+o),'tocar #'+i+' teste contagem '+o);
      if(await waitIndex(i,4000)){LS.set('dsp_moff',o);dlog('contagem ajustada: '+o);return done()}
    }
    // última tentativa: se estiver perto, anda de uma em uma
    const d=i-S.status.index;
    if(S.status.index>0&&Math.abs(d)<=12){
      dlog('andando '+d+' faixas');
      for(let k=0;k<Math.abs(d);k++)await send(ASCII(CMD[d>0?'next':'prev']),d>0?'próxima':'anterior');
      if(await waitIndex(i,5000))return done();
    }
    toast('O aparelho não aceitou tocar "'+nm+'". Mande o diagnóstico.');dlog('FALHOU tocar #'+i);
  }finally{S.expect={at:Date.now(),index:i}}
  function done(){dlog('ok: tocando #'+i);S.expect={at:Date.now(),index:i};renderLive()}
}

}

function setPMode(m){S.pmode=m;LS.set('dsp_pmode',m);const b=upd('5');b[5]=m;send(b,'modo');renderAll()}

/* ---------- troca de faixa: fila e playlist ---------- */
function onTrackChanged(prev,cur){
  addRecent(cur);
  const ours=S.expect&&(Date.now()-S.expect.at<5000||S.expect.index===cur);
  if(ours)return;
  // o aparelho trocou sozinho (música acabou): a fila manda
  if(S.upnext.length){playIndex(S.upnext.shift(),'fila');toast('Tocando a próxima da fila');return}
  if(S.queue){queueStep(1)}
}
function addRecent(i){const t=trackByIndex(i);if(!t)return;const k=tkey(t);S.recent=[k,...S.recent.filter(x=>x!==k)].slice(0,30);LS.set('dsp_recent',S.recent)}
function startPlaylist(id,shuffle,startPos=0){
  const pl=S.playlists.find(p=>p.id===id);if(!pl||!pl.items.length)return toast('Playlist vazia');
  let order=pl.items.map(k=>trackByKey(k)).filter(Boolean).map(t=>t.i);
  if(!order.length)return toast('As músicas dessa playlist não estão neste pendrive');
  if(shuffle){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}startPos=0}
  S.queue={plId:id,pos:startPos,order};
  if(S.pmode!==1)setPMode(1);
  playIndex(order[startPos]);toast('Playlist: '+pl.name);renderAll();
}
function queueStep(d){const q=S.queue;if(!q)return;q.pos=(q.pos+d+q.order.length)%q.order.length;playIndex(q.order[q.pos])}
function playNext(idxs,end){ // tocar a seguir / adicionar ao fim da fila
  idxs=idxs.filter(i=>i!=null);
  if(end)S.upnext.push(...idxs);else S.upnext.unshift(...idxs);
  toast(end?`${idxs.length} na fila`:'Vai tocar a seguir');renderLive();
}

/* ================= BIBLIOTECA ================= */
function trackByIndex(i){return S.lib?.tracks.find(t=>t.i===i)}
function trackByKey(k){if(typeof k==='number')return trackByIndex(k);if(/^#\d+$/.test(k))return trackByIndex(+k.slice(1));return S.lib?.tracks.find(t=>tkey(t)===k)}
function folderPath(f){ // caminho virtual: segue a organização que você fez
  if(!f)return [];
  const parts=f.split(/[\\/]+/).filter(Boolean);
  let top=parts[0],chain=[],seen=new Set();
  while(S.parent[top]&&!seen.has(top)){seen.add(top);chain.unshift(S.parent[top]);top=S.parent[top]}
  return [...chain,...parts];
}
function buildTree(){
  const root={name:'Pendrive',key:'',folders:{},tracks:[]};
  const ensure=path=>{let n=root;path.forEach((p,k)=>{n.folders[p]=n.folders[p]||{name:p,key:path.slice(0,k+1).join('/'),folders:{},tracks:[]};n=n.folders[p]});return n};
  Object.entries(S.parent).forEach(([c])=>ensure(folderPath(c)));
  (S.lib?.tracks||[]).forEach(t=>ensure(folderPath(t.folder)).tracks.push(t));
  return root;
}
const countDeep=n=>n.tracks.length+Object.values(n.folders).reduce((a,f)=>a+countDeep(f),0);
const allTracks=n=>[...n.tracks,...Object.values(n.folders).flatMap(allTracks)];
const hasIndex=(n,i)=>n.tracks.some(t=>t.i===i)||Object.values(n.folders).some(f=>hasIndex(f,i));
const allFolderNames=()=>[...new Set([...(S.lib?.tracks||[]).map(t=>t.folder).filter(Boolean),...Object.keys(S.parent),...Object.values(S.parent)])].sort((a,b)=>a.localeCompare(b,'pt',{numeric:true}));

/* ---------- leitura rápida do pendrive ----------
   - nome de cada música: 1 pergunta por música
   - pasta: pergunta só de 4 em 4 e confere os limites (as músicas da mesma pasta vêm juntas)
   - vai mostrando enquanto carrega, salva o progresso e continua de onde parou */
function startScanIfNeeded(){
  const total=S.status.total;if(!total)return;
  if(S.lib&&S.lib.total===total&&S.lib.done)return;
  if(!S.lib||S.lib.total!==total)S.lib={total,tracks:[],done:false,next:0,folderAt:{}};
  runScan();
}
async function runScan(force){
  if(S.mode!=='ble')return;
  if(force)S.lib={total:S.status.total,tracks:[],done:false,next:0,folderAt:{}};
  if(S.scan&&S.scan.running)return;
  const L=S.lib;L.folderAt=L.folderAt||{};
  S.scan={running:true,paused:false,t0:Date.now(),startAt:L.next};
  const total=L.total;
  const F=async i=>{if(i in L.folderAt)return L.folderAt[i];let f='';try{f=txt(await ask('Y',i,700,2))}catch(e){f=null}if(f==='/')f='';L.folderAt[i]=f;return f};
  const fill=async(a,b)=>{ // descobre a pasta de a..b
    const fa=await F(a),fb=await F(b);
    if(b-a<=1)return;
    if(fa===fb&&fa!==null){for(let k=a+1;k<b;k++)L.folderAt[k]=fa;return}
    const m=(a+b)>>1;await fill(a,m);await fill(m,b);
  };
  const STEP=4;let chunks=0;
  try{
    let i=L.next;
    while(i<=total){
      if(!S.scan||S.scan.paused||S.mode!=='ble')break;
      const j=Math.min(i+STEP-1,total);
      for(let k=i;k<=j;k++){
        if(L.tracks.some(t=>t.i===k))continue;
        let name='';try{name=txt(await ask('X',k,700,2))}catch(e){}
        if(name&&name.toUpperCase()!=='UNKNOWN')L.tracks.push({i:k,name,folder:''});
      }
      await fill(i>0?i-1:i,j);
      L.tracks.forEach(t=>{if(t.i>=i&&t.i<=j&&L.folderAt[t.i]!=null)t.folder=L.folderAt[t.i]||''});
      L.next=j+1;i=j+1;
      S.scan.done=j;chunks++;
      if(chunks%5===0||j>=total){save.lib();renderScanBar();if(S.tab==='folders'&&!S.q)renderKeep()}
    }
  }catch(e){dlog('leitura interrompida: '+e)}
  if(L.next>total){L.done=true;delete L.folderAt;save.lib();toast(L.tracks.length+' músicas carregadas');}
  else save.lib();
  S.scan.running=false;if(L.done)S.scan=null;
  renderAll();
}
function renderScanBar(){const e=$('#scanbar');if(e)e.outerHTML=ScanBar()}
function ScanBar(){
  const s=S.scan,L=S.lib;
  if(!L||L.done)return '<div id="scanbar" class="hide"></div>';
  const pct=Math.round((s?.done||L.next||0)/Math.max(1,L.total)*100);
  const el=s&&s.running?(Date.now()-s.t0)/1000:0;const doneN=(s?.done||0)-(s?.startAt||0);
  const eta=s&&s.running&&doneN>8?Math.round(el/doneN*(L.total-s.done)):null;
  return `<div class="scanbar" id="scanbar">${s&&s.running?'<div class="spin"></div>':ic('folder','style="width:22px;height:22px;color:var(--acc)"')}
    <div class="t"><b>${s&&s.running?'Lendo o pendrive…':'Leitura pausada'}</b><small>${L.tracks.length} músicas • ${pct}%${eta!=null?' • falta ~'+(eta>90?Math.round(eta/60)+' min':eta+' s'):''} • já dá pra navegar e tocar</small><div class="progress"><i style="width:${pct}%"></i></div></div>
    ${s&&s.running?`<button class="btn2" data-do="scanpause">Pausar</button>`:`<button class="btn2" data-do="scanresume">Continuar</button>`}</div>`;
}

const hueOf=s=>{let h=0;for(const c of (s||''))h=(h*31+c.charCodeAt(0))%360;return h};

let pickCb=null;
function pickImage(cb){
  pickCb=cb;
  const f=$('#filePick');f.value='';
  f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>resizeImg(r.result).then(d=>{if(pickCb)pickCb(d);pickCb=null});r.readAsDataURL(file)};
  f.click();
}
function resizeImg(src,size=420){return new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');const s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,size,size);res(c.toDataURL('image/jpeg',.85))}catch(e){res(src)}};im.onerror=()=>res(src);im.src=src})}
// busca capa na internet (iTunes) — precisa de internet no celular
function searchCover(term,cb){
  const d=sheet(`<h3>Buscar capa na internet</h3><input class="field" id="cq" value="${esc(term)}" placeholder="Artista, álbum ou música"><button class="btn2" style="width:100%;margin-bottom:12px" id="cgo">${ic('search')} Buscar</button><div class="artgrid" id="cres"><div class="note">Toque em Buscar</div></div>`);
  const go=()=>{
    const q=d.querySelector('#cq').value.trim();if(!q)return;
    const box=d.querySelector('#cres');box.innerHTML='<div class="spin"></div>';
    const name='cb'+Date.now();const sc=document.createElement('script');
    const to=setTimeout(()=>{box.innerHTML='<div class="note">Sem internet ou nada encontrado.</div>';cleanup()},9000);
    const cleanup=()=>{delete window[name];sc.remove()};
    window[name]=r=>{clearTimeout(to);cleanup();
      const arts=[...new Set((r.results||[]).map(x=>(x.artworkUrl100||'').replace('100x100','600x600')).filter(Boolean))].slice(0,12);
      box.innerHTML=arts.length?arts.map(u=>`<button data-u="${esc(u)}"><img src="${esc(u)}"></button>`).join(''):'<div class="note">Nada encontrado. Tente outro nome.</div>';
      box.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{toast('Salvando capa…');const data=await resizeImg(b.dataset.u);closeSheet();cb(data)});
    };
    sc.onerror=()=>{clearTimeout(to);box.innerHTML='<div class="note">Sem internet agora.</div>';cleanup()};
    sc.src='https://itunes.apple.com/search?media=music&entity=album&limit=12&country=BR&term='+encodeURIComponent(q)+'&callback='+name;
    document.body.appendChild(sc);
  };
  d.querySelector('#cgo').onclick=go;go();
}
function coverMenu(kind,key,label,after){
  const k=(kind==='f'?'f:':'t:')+key;
  const d=sheet(`<h3>Capa</h3><p>${esc(label)}</p>
    <button class="mi" data-c="gal">${ic('image')} Escolher da galeria</button>
    <button class="mi" data-c="web">${ic('globe')} Buscar na internet</button>
    ${IDB.mem[k]?`<button class="mi danger" data-c="del">${ic('trash')} Remover capa</button>`:''}`);

/* ----- EQUALIZADOR ----- */
function eqState(ch){return S.eq[ch]||(S.eq[ch]={preset:0,bands:[0,0,0,0,0,0]})}
function Eq(){
  const tabs=[['geq','Equalizador'],['gain','Ganho'],['xover','Crossover'],['delay','Delay'],['phase','Fase']];
  const head=`<h1 class="title">Áudio<small>Equalização e ajustes de saída do DS Player</small></h1>
   <div class="seg" style="margin-bottom:14px;overflow-x:auto">${tabs.map(([k,n])=>`<button class="${S.eqTab===k?'on':''}" data-eqtab="${k}" style="font-size:12.5px;min-width:86px">${n}</button>`).join('')}</div>`;

}
function EqGraphic(){
  const st=eqState(S.eqCh);
  return `<div class="card"><div class="label">Canais</div><div class="seg">${EQCH.map(([c,n])=>`<button class="${S.eqCh===c?'on':''}" data-eqch="${c}" style="font-size:12px">${n}</button>`).join('')}</div></div>
  <div class="card"><div class="label"><span>Equalizador gráfico</span><span class="pill ${st.preset===-1?'acc':''}">${st.preset===-1?'Personalizado':PRESETS[st.preset][0]}</span></div>
    <svg class="eqcurve" viewBox="0 0 300 70" preserveAspectRatio="none" id="eqcurve">${curve(st.bands)}</svg>
    <div class="eqwrap">${st.bands.map((v,k)=>`<div class="band"><div class="val" id="bv${k}">${v>0?'+':''}${v}</div><div class="vslide" data-band="${k}"><div class="track"></div><div class="zero"></div><div class="fill"></div><div class="knob"></div></div><div class="lbl">${BANDS[k]}</div></div>`).join('')}</div>
    <div class="note" style="text-align:center;margin-top:6px">graves ← → agudos • −12 a +12 dB</div>
  </div>
  <div class="card"><div class="label">Presets</div><div class="chips">${PRESETS.map(([n],k)=>`<button class="chip ${st.preset===k?'on':''}" data-preset="${k}">${n}</button>`).join('')}</div>
    <div class="row2" style="margin-top:14px"><button class="btn2" data-do="eqflat">${ic('refresh')} Zerar</button><button class="btn2" data-do="eqcopy">Copiar p/ todos</button></div></div>`;
}
const stepper=(id,val,unit)=>`<div style="display:flex;align-items:center;gap:6px"><button class="mini-b" data-step="${id}:-10" style="background:var(--card2)">−10</button><button class="mini-b" data-step="${id}:-1" style="background:var(--card2)">−</button><b style="min-width:64px;text-align:center;font-variant-numeric:tabular-nums">${val==null?'—':val}${val==null?'':unit}</b><button class="mini-b" data-step="${id}:1" style="background:var(--card2)">+</button><button class="mini-b" data-step="${id}:10" style="background:var(--card2)">+10</button></div>`;
function EqGain(){
  return `<div class="card"><div class="label"><span>Ganho por canal</span><button class="pill" data-do="readaudio">Ler do aparelho</button></div>
   ${CHS.map(([c,n])=>{const v=S.gain[c]??100;return `<div class="sw"><b style="min-width:52px">${n}</b><input type="range" min="0" max="100" value="${v}" data-gain="${c}" style="--p:${v}%"><span class="num" style="min-width:34px;text-align:right;font-weight:800" id="gv${c}">${v}</span></div>`}).join('')}
   <p class="note" style="margin-top:8px">0 a 100 (100 = máximo, padrão de fábrica).</p></div>`;
}
function EqPhase(){
  return `<div class="card"><div class="label">Fase</div>
   ${CHS.map(([c,n])=>{const inv=!!S.phase[c];return `<div class="sw"><b>${n}</b><div class="seg" style="width:220px"><button class="${!inv?'on':''}" data-phase="${c}:0">Normal 0°</button><button class="${inv?'on':''}" data-phase="${c}:1">Invertida 180°</button></div></div>`}).join('')}
   <p class="note" style="margin-top:8px">Inverta a fase quando o grave "some" com dois alto-falantes juntos.</p></div>`;
}
function EqDelay(){
  return `<div class="card"><div class="label"><span>Delay por canal</span><button class="pill" data-do="readaudio">Ler do aparelho</button></div>
   ${CHS.map(([c,n])=>`<div class="sw"><b>${n}</b>${stepper('d'+c,S.delay[c]??0,'')}</div>`).join('')}
   <p class="note" style="margin-top:8px">Valor na mesma unidade do app oficial. Use "Ler do aparelho" para ver o que está gravado.</p></div>`;
}
function EqXover(){
  return EQCH.map(([c,n])=>{const x=S.xo[c]||{};return `<div class="card"><div class="label"><span>Crossover ${n}</span>${x.read?'<span class="pill">lido do aparelho</span>':''}</div>
    <div class="sw"><span><b>Passa-alta</b><small class="note" style="display:block">corta abaixo de</small></span>${stepper('h'+c,x.hpf,' Hz')}</div>
    <div class="sw"><span><b>Passa-baixa</b><small class="note" style="display:block">corta acima de</small></span>${stepper('l'+c,x.lpf,' Hz')}</div></div>`}).join('')+
   `<div class="card"><button class="btn2" style="width:100%" data-do="readaudio">${ic('refresh')} Ler valores do aparelho</button><p class="note" style="margin-top:10px">O crossover só é enviado quando os dois valores (passa-alta e passa-baixa) estiverem definidos. Os botões andam pelas frequências padrão.</p></div>`;
}
function sendGain(c,v){S.gain[c]=v;LS.set('dsp_gain',S.gain);clearTimeout(eqT['g'+c]);eqT['g'+c]=setTimeout(()=>{const b=upd('I');b[1]=c.charCodeAt(0);b[2]=v;send(b,'ganho '+c)},250)}
function sendPhase(c,inv){S.phase[c]=inv;LS.set('dsp_phase',S.phase);const b=upd('H');b[1]=c.charCodeAt(0);b[2]=inv?1:0;send(b,'fase '+c)}
function sendDelay(c,v){S.delay[c]=v;LS.set('dsp_delay',S.delay);clearTimeout(eqT['d'+c]);eqT['d'+c]=setTimeout(()=>{const b=upd('K');b[1]=c.charCodeAt(0);b[2]=(v>>8)&255;b[3]=v&255;send(b,'delay '+c)},300)}
function sendXo(c){const x=S.xo[c];LS.set('dsp_xo',S.xo);if(x.hpf==null||x.lpf==null)return toast('Defina passa-alta e passa-baixa');clearTimeout(eqT['x'+c]);eqT['x'+c]=setTimeout(()=>{const b=upd('X');b[1]=c.charCodeAt(0);b[2]=(x.hpf>>8)&255;b[3]=x.hpf&255;b[4]=(x.lpf>>8)&255;b[5]=x.lpf&255;send(b,'crossover '+c)},300)}
function stepVal(id,d){
  const kind=id[0],c=id.slice(1);
  if(kind==='d'){const v=Math.max(0,Math.min(9999,(S.delay[c]??0)+d));sendDelay(c,v);return renderKeep()}
  const x=S.xo[c]=S.xo[c]||{};const list=kind==='h'?XO_HPF:XO_LPF;const key=kind==='h'?'hpf':'lpf';
  let cur=x[key];let pos=cur==null?(kind==='h'?0:list.length-1):list.findIndex(f=>f>=cur);if(pos<0)pos=list.length-1;
  const stepN=Math.abs(d)>=10?3:1;pos=Math.max(0,Math.min(list.length-1,pos+(d>0?stepN:-stepN)));
  if(cur==null)pos=kind==='h'?0:list.length-1;
  x[key]=list[pos];
  if(x.hpf!=null&&x.lpf!=null&&x.hpf>=x.lpf){toast('Passa-alta precisa ser menor que a passa-baixa');x[key]=cur;return}
  sendXo(c);renderKeep();
}
async function readAudio(){
  if(S.mode!=='ble')return toast('Conecte primeiro');
  toast('Lendo ajustes…');
  try{const v=await ask('Q',null,1200,2);dlog('ganho lido: '+hex(v));CHS.forEach(([c],k)=>{if(v[2+k]!=null&&v[2+k]<=100)S.gain[c]=v[2+k]});LS.set('dsp_gain',S.gain)}catch(e){dlog('ganho: sem resposta')}
  try{const v=await ask('T',null,1200,2);dlog('delay lido: '+hex(v));CHS.forEach(([c],k)=>{const p=2+k*2;if(v[p+1]!=null)S.delay[c]=(v[p]<<8)|v[p+1]});LS.set('dsp_delay',S.delay)}catch(e){dlog('delay: sem resposta')}
  for(const [c,l] of [['A','j'],['C','k'],['E','l']]){
    try{const v=await ask(l,null,1200,2);dlog('crossover '+c+' lido: '+hex(v));const h=(v[2]<<8)|v[3],lp=(v[4]<<8)|v[5];if(h>=10&&h<=22000&&lp>=10&&lp<=22000){S.xo[c]={hpf:h,lpf:lp,read:true}}}catch(e){dlog('crossover '+c+': sem resposta')}
  }
  LS.set('dsp_xo',S.xo);toast('Ajustes lidos');if(S.tab==='eq')renderKeep();
}
function curve(b){const pts=b.map((v,k)=>[25+k*50,35-v*2.6]);let d=`M0 ${pts[0][1]} `;pts.forEach(([x,y],k)=>{if(k===0){d+=`L${x} ${y} `;return}const [px,py]=pts[k-1];const cx=(px+x)/2;d+=`C${cx} ${py} ${cx} ${y} ${x} ${y} `});d+=`L300 ${pts[5][1]}`;
  return `<defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#ff3346"/><stop offset="1" stop-color="#ff7a45"/></linearGradient></defs><line x1="0" y1="35" x2="300" y2="35" stroke="#ffffff22" stroke-dasharray="4 4"/><path d="${d}" fill="none" stroke="url(#g1)" stroke-width="3" stroke-linecap="round"/>`}
const eqT={};
function sendEq(ch){
  clearTimeout(eqT[ch]);eqT[ch]=setTimeout(()=>{const st=eqState(ch);const b=upd('E');const pos=[1,2,3,4,5,7];st.bands.forEach((v,k)=>b[pos[k]]=Math.max(0,Math.min(24,v+12)));b[13]=ch.charCodeAt(0);send(b,'EQ '+ch)},300);
  save.eq();
}
function setupEqSliders(root){
  root.querySelectorAll('.vslide').forEach(el=>{
    const k=+el.dataset.band;
    const paint=()=>{const v=eqState(S.eqCh).bands[k];const h=el.clientHeight;const y=h/2-v/12*(h/2-15);el.querySelector('.knob').style.top=y+'px';const f=el.querySelector('.fill');f.style.top=Math.min(y,h/2)+'px';f.style.height=Math.abs(y-h/2)+'px';const bv=$('#bv'+k);if(bv)bv.textContent=(v>0?'+':'')+v};
    paint();
    const setFrom=e=>{const r=el.getBoundingClientRect();const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;let v=Math.round((r.height/2-y)/(r.height/2-15)*12);v=Math.max(-12,Math.min(12,v));const st=eqState(S.eqCh);if(st.bands[k]!==v){st.bands[k]=v;st.preset=-1;paint();$('#eqcurve').innerHTML=curve(st.bands);sendEq(S.eqCh)}};
    const up=()=>{window.removeEventListener('pointermove',setFrom);window.removeEventListener('pointerup',up);renderKeep()};
    el.addEventListener('pointerdown',e=>{e.preventDefault();setFrom(e);window.addEventListener('pointermove',setFrom);window.addEventListener('pointerup',up)});
  });
}

  return `<h1 class="title">Ajustes</h1>

    <div class="sw"><span>Liga / desliga</span><div class="row2" style="flex:none;gap:8px"><button class="btn2" data-pw="1">${ic('power')} Ligar</button><button class="btn2 danger" data-pw="0">Desligar</button></div></div>
    <div class="sw"><span>Desligar automático ${S.sleepAt?`<small class="note">(em ${sleepLeft} min)</small>`:''}</span><div class="chips">${[0,15,30,60].map(m=>`<button class="chip ${(!S.sleepAt&&!m)||(S.sleepAt&&S._sleepM===m)?'on':''}" data-sleep="${m}" style="padding:8px 11px">${m?m+' min':'Off'}</button>`).join('')}</div></div>
    <div style="margin-top:12px">${S.mode==='off'?`<button class="bigbtn" data-do="connect">${ic('bt')} Conectar</button>`:`<button class="btn2" style="width:100%" data-do="disconnect">${ic('x')} Desconectar</button>`}</div>
  </div>
  <div class="card"><div class="label">Pendrive</div>
    <div class="sw"><span>Músicas</span><b>${S.lib?S.lib.tracks.length:0}${S.lib&&!S.lib.done?' (lendo…)':''}</b></div>
    <div class="sw"><span>Pastas</span><b>${allFolderNames().length}</b></div>
    <p class="note" style="margin:10px 0">A lista fica salva no celular. Leia de novo quando trocar as músicas do pendrive.</p>
    <div class="row2"><button class="btn2" data-do="rescan">${ic('refresh')} Ler de novo</button><button class="btn2" data-do="resetorg">Desfazer organização</button></div>
  </div>
  <div class="card"><div class="label">Senha do aparelho</div>
    <div class="sw"><span>Senha salva</span><b>${'•'.repeat(String(LS.get('dsp_pass','1234')).length)}</b></div>
    <button class="btn2" style="width:100%;margin-top:10px" data-do="pass">Trocar senha salva</button></div>
  <div class="card"><div class="label">Diagnóstico</div>
    <div class="row2"><button class="btn2" data-do="diag">Ver diagnóstico</button><button class="btn2" data-do="copydiag">Copiar</button></div></div>
  <div class="card"><div class="label">Sobre</div><p class="note">DS Control v3.1 • by @guucds<br>Para Stetsom DS Player (HL 400.4, HL 800.4, CL 800.4, CL 400.4 24V, BOB 400.4 AC, PROC 400.4).</p></div>`;
}

/* ================= EVENTOS ================= */
function bind(root){
  const on=(sel,fn)=>root.querySelectorAll(sel).forEach(b=>b.onclick=e=>{e.stopPropagation();fn(b,e)});
  on('[data-act]',b=>act(b.dataset.act));
  on('[data-src]',b=>setSource(b.dataset.src));
  on('[data-pm]',b=>setPMode(+b.dataset.pm));
  on('[data-pw]',b=>setPower(b.dataset.pw==='1'));
  on('[data-sleep]',b=>{const m=+b.dataset.sleep;S._sleepM=m;S.sleepAt=m?Date.now()+m*60000:null;toast(m?'Desliga em '+m+' min':'Desligar automático: off');renderKeep()});
  on('[data-tab2]',b=>go(b.dataset.tab2));
  on('[data-play]',b=>{S.queue=null;playIndex(+b.dataset.play)});
  on('[data-qn]',b=>playNext([+b.dataset.qn]));
  on('[data-trkmenu]',b=>trackMenu(+b.dataset.trkmenu));
  on('[data-fmenu]',b=>folderMenu(b.dataset.fmenu));
  on('[data-fav]',b=>toggleFav(b.dataset.fav));
  on('[data-open]',b=>{saveScroll();S.nav.path.push(b.dataset.open);render();main.scrollTop=0});
  on('[data-go]',b=>{saveScroll();S.nav.path=S.nav.path.slice(0,+b.dataset.go);render()});
  on('[data-jump]',b=>{S.q='';saveScroll();S.nav.path=folderPath(b.dataset.jump);render();main.scrollTop=0});
  on('[data-plopen]',b=>{S.openPl=b.dataset.plopen;render();main.scrollTop=0});
  on('[data-plplay]',b=>startPlaylist(S.openPl,false,+b.dataset.plplay));
  on('[data-plshuf]',()=>startPlaylist(S.openPl,true));
  on('[data-mv]',b=>{const[k,d]=b.dataset.mv.split(':').map(Number);const pl=S.playlists.find(p=>p.id===S.openPl);const j=k+d;if(j<0||j>=pl.items.length)return;[pl.items[k],pl.items[j]]=[pl.items[j],pl.items[k]];save.pl();renderKeep()});
  on('[data-rm]',b=>{const pl=S.playlists.find(p=>p.id===S.openPl);pl.items.splice(+b.dataset.rm,1);save.pl();renderKeep()});
  on('[data-qup]',b=>{const k=+b.dataset.qup;if(k>0){[S.upnext[k-1],S.upnext[k]]=[S.upnext[k],S.upnext[k-1]]}renderLive()});
  on('[data-qrm]',b=>{S.upnext.splice(+b.dataset.qrm,1);renderLive()});
  on('[data-eqch]',b=>{S.eqCh=b.dataset.eqch;renderKeep()});
  on('[data-eqtab]',b=>{S.eqTab=b.dataset.eqtab;renderKeep();if(['gain','delay','xover'].includes(S.eqTab)&&S.mode==='ble'&&!S._audioRead){S._audioRead=1;readAudio()}});
  on('[data-phase]',b=>{const[c,v]=b.dataset.phase.split(':');sendPhase(c,v==='1');renderKeep()});
  on('[data-step]',b=>{const[id,d]=b.dataset.step.split(':');stepVal(id,+d)});
  root.querySelectorAll('[data-gain]').forEach(r=>r.oninput=e=>{const v=+e.target.value;r.style.setProperty('--p',v+'%');const n=$('#gv'+r.dataset.gain);if(n)n.textContent=v;sendGain(r.dataset.gain,v)});
  on('[data-preset]',b=>{const k=+b.dataset.preset;const st=eqState(S.eqCh);st.preset=k;st.bands=[...PRESETS[k][1]];sendEq(S.eqCh);renderKeep()});
  on('[data-do]',b=>doAction(b.dataset.do));
  root.querySelectorAll('.volr').forEach(vol=>vol.oninput=e=>{const v=+e.target.value;document.querySelectorAll('.volN').forEach(n=>n.textContent=v);document.querySelectorAll('.volr').forEach(r=>{r.value=v;r.style.setProperty('--p',Math.round(v/50*100)+'%')});setVolume(v)});
  const q=root.querySelector('#q');if(q)q.oninput=e=>{S.q=e.target.value;const pos=q.selectionStart;renderKeep();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
  if(root===main&&S.tab==='eq'&&S.eqTab==='geq')setupEqSliders(root);
}
function goUp(){saveScroll();S.nav.path.pop();render()}
function toggleFav(k){if(S.favs.includes(k))S.favs=S.favs.filter(x=>x!==k);else S.favs.unshift(k);save.favs();toast(S.favs.includes(k)?'Adicionada às favoritas':'Removida das favoritas');renderAll()}
function doAction(a){
  const A={
    connect,demo:startDemo,
    disconnect(){if(NATIVE)window.AndroidBLE.disconnect();S.mode='off';S.queue=null;renderAll()},
    scan(){runScan()},rescan(){if(S.mode!=='ble')return toast('Conecte primeiro');confirmSheet('Ler o pendrive de novo?','A lista atual será trocada. Playlists, capas e favoritas continuam.','Ler de novo',()=>{runScan(true);go('folders')})},
    scanpause(){if(S.scan)S.scan.paused=true;toast('Leitura pausada');setTimeout(renderScanBar,300)},
    scanresume(){if(S.mode!=='ble')return toast('Conecte primeiro');runScan();renderScanBar()},
    resetorg(){confirmSheet('Desfazer organização?','Todas as pastas voltam para a raiz.','Desfazer',()=>{S.parent={};save.parent();S.nav.path=[];renderAll()})},
    up:goUp,
    view(){S.view=S.view==='grid'?'list':'grid';LS.set('dsp_view',S.view);renderKeep()},
    sort(){S.sort={az:'za',za:'pd',pd:'az'}[S.sort];LS.set('dsp_sort',S.sort);toast({az:'A → Z',za:'Z → A',pd:'Ordem do pendrive'}[S.sort]);renderKeep()},
    playfolder(){const ts=byIdx(allTracks(curNode()));if(!ts.length)return;S.queue=null;S.upnext=ts.slice(1).map(t=>t.i);playIndex(ts[0].i);toast('Tocando a pasta')},
    playfavs(){const ts=S.favs.map(trackByKey).filter(Boolean);if(!ts.length)return;S.queue=null;S.upnext=ts.slice(1).map(t=>t.i);playIndex(ts[0].i);toast('Tocando favoritas')},
    clearq(){S.upnext=[];renderLive()},
    plnew(){promptName('Nova playlist','',n=>{const p={id:'p'+Date.now(),name:n,items:[]};S.playlists.push(p);save.pl();S.openPl=p.id;render()})},
    plback(){S.openPl=null;render()},
    plmenu(){const pl=S.playlists.find(p=>p.id===S.openPl);const d=sheet(`<h3>${esc(pl.name)}</h3><button class="mi" data-m="ren">${ic('edit')} Renomear</button><button class="mi" data-m="cov">${ic('image')} Capa da playlist</button><button class="mi" data-m="q">${ic('queue')} Adicionar tudo à fila</button><button class="mi danger" data-m="del">${ic('trash')} Apagar playlist</button>`);
      d.querySelector('[data-m=ren]').onclick=()=>{closeSheet();promptName('Renomear',pl.name,n=>{pl.name=n;save.pl();render()})};
      d.querySelector('[data-m=cov]').onclick=()=>{closeSheet();coverMenu('p',pl.id,pl.name)};
      d.querySelector('[data-m=q]').onclick=()=>{closeSheet();playNext(pl.items.map(k=>trackByKey(k)?.i),true)};
      d.querySelector('[data-m=del]').onclick=()=>{closeSheet();confirmSheet('Apagar "'+pl.name+'"?','A playlist será removida.','Apagar',()=>{S.playlists=S.playlists.filter(p=>p!==pl);if(S.queue?.plId===pl.id)S.queue=null;save.pl();S.openPl=null;render()})}},
    stopq(){S.queue=null;renderAll()},
    readaudio:readAudio,
    eqflat(){const st=eqState(S.eqCh);st.preset=0;st.bands=[0,0,0,0,0,0];sendEq(S.eqCh);renderKeep()},
    eqcopy(){const st=eqState(S.eqCh);EQCH.forEach(([c])=>{S.eq[c]={preset:st.preset,bands:[...st.bands]};sendEq(c)});toast('Aplicado em todos os canais');save.eq()},
    pass:askPassword,
    diag(){sheet(`<h3>Diagnóstico</h3><p>Mande um print disso se algo não funcionar</p><pre class="diag">${esc(BLE.log.slice(-150).join('\n')||'Nada ainda.')}</pre>`)},
    copydiag(){navigator.clipboard?.writeText(BLE.log.join('\n')).then(()=>toast('Copiado'),()=>toast('Não deu pra copiar'))}
  };
  A[a]&&A[a]();
}
// coverMenu para playlist usa chave 'p:'
const _cm=coverMenu;coverMenu=function(kind,key,label,after){if(kind==='p'){const k='p:'+key;const d=sheet(`<h3>Capa</h3><p>${esc(label)}</p><button class="mi" data-c="gal">${ic('image')} Escolher da galeria</button><button class="mi" data-c="web">${ic('globe')} Buscar na internet</button>${IDB.mem[k]?`<button class="mi danger" data-c="del">${ic('trash')} Remover</button>`:''}`);const set=v=>{IDB.set(k,v);renderAll()};d.querySelector('[data-c=gal]').onclick=()=>{closeSheet();pickImage(set)};d.querySelector('[data-c=web]').onclick=()=>{closeSheet();searchCover(label,set)};const x=d.querySelector('[data-c=del]');if(x)x.onclick=()=>{closeSheet();set(null)};return}return _cm(kind,key,label,after)};

function trackMenu(i){
  const t=trackByIndex(i);if(!t)return;const fav=S.favs.includes(tkey(t));
  const d=sheet(`<div class="head">${coverHTML(coverOf(t),t.name)}<div><b>${esc(cleanName(t.name))}</b><small>${esc(folderPath(t.folder).join(' › ')||'Raiz')}</small></div></div>
    <button class="mi" data-m="play">${ic('play')} Tocar agora</button>
    <button class="mi" data-m="next">${ic('qnext')} Tocar a seguir</button>
    <button class="mi" data-m="end">${ic('queue')} Adicionar ao fim da fila</button>
    <button class="mi" data-m="pl">${ic('list')} Adicionar à playlist</button>
    <button class="mi" data-m="fav">${ic(fav?'heartf':'heart')} ${fav?'Remover das favoritas':'Favoritar'}</button>
    <button class="mi" data-m="cov">${ic('image')} Capa desta música</button>
    <button class="mi" data-m="go">${ic('folder')} Ir para a pasta</button>`);
  const m=(k,f)=>d.querySelector(`[data-m=${k}]`).onclick=()=>{closeSheet();f()};
  m('play',()=>{S.queue=null;playIndex(i)});m('next',()=>playNext([i]));m('end',()=>playNext([i],true));
  m('pl',()=>pickPlaylist([tkey(t)]));m('fav',()=>toggleFav(tkey(t)));m('cov',()=>coverMenu('t',tkey(t),t.name));
  m('go',()=>{S.q='';S.nav.path=folderPath(t.folder);go('folders')});
}
function folderMenu(name){
  const n=findNode(name);const ts=n?byIdx(allTracks(n)):[];
  const d=sheet(`<div class="head">${coverHTML(n?coverOfFolder(n):null,name,'','',null)}<div><b>${esc(name)}</b><small>${ts.length} músicas</small></div></div>
    <button class="mi" data-m="play">${ic('play')} Tocar pasta</button>
    <button class="mi" data-m="next">${ic('qnext')} Tocar a seguir</button>
    <button class="mi" data-m="pl">${ic('list')} Adicionar à playlist</button>
    <button class="mi" data-m="cov">${ic('image')} Capa do CD (pasta)</button>
    <button class="mi" data-m="move">${ic('move')} Mover para dentro de…</button>
    ${S.parent[name]?`<button class="mi" data-m="root">${ic('up')} Tirar de "${esc(S.parent[name])}"</button>`:''}`);
  const m=(k,f)=>{const e=d.querySelector(`[data-m=${k}]`);if(e)e.onclick=()=>{closeSheet();f()}};
  m('play',()=>{if(!ts.length)return;S.queue=null;S.upnext=ts.slice(1).map(t=>t.i);playIndex(ts[0].i)});
  m('next',()=>playNext(ts.map(t=>t.i)));
  m('pl',()=>pickPlaylist(ts.map(tkey)));
  m('cov',()=>coverMenu('f',name,name));
  m('move',()=>moveFolder(name));
  m('root',()=>{delete S.parent[name];save.parent();S.nav.path=[];renderAll();toast('Movida para a raiz')});
}
function findNode(name){let found=null;(function w(n){if(found)return;Object.values(n.folders).forEach(f=>{if(f.name===name)found=f;else w(f)})})(buildTree());return found}
function moveFolder(name){
  // não pode mover para dentro dela mesma ou de uma filha
  const isDesc=(c,a)=>{let x=c,seen=new Set();while(S.parent[x]&&!seen.has(x)){seen.add(x);if(S.parent[x]===a)return true;x=S.parent[x]}return false};
  const opts=allFolderNames().filter(f=>f!==name&&!isDesc(f,name));
  const d=sheet(`<h3>Mover "${esc(name)}" para dentro de…</h3><p>Isso só muda a organização no app. O pendrive não é alterado.</p>
    <label class="search" style="margin-bottom:10px">${ic('search')}<input id="mq" placeholder="Procurar pasta"></label>
    <div id="mlist">${opts.map(f=>`<button class="mi" data-to="${esc(f)}">${ic('folder')} ${esc(folderPath(f).join(' › '))}</button>`).join('')}</div>
    <button class="ghost" data-to="__new" style="margin-top:8px">${ic('plus')} Criar pasta nova e mover</button>`);
  const bindTo=()=>d.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>{
    const to=b.dataset.to;
    const done=t=>{S.parent[name]=t;save.parent();closeSheet();toast('"'+name+'" agora está dentro de '+t);if(S.nav.path.includes(name))S.nav.path=[];renderKeep();renderPanel()};
    if(to==='__new'){closeSheet();promptName('Nome da pasta nova','',n=>{done(n)},'Nome da pasta');return}
    done(to);
  });
  bindTo();
  d.querySelector('#mq').oninput=e=>{const q=e.target.value.toLowerCase();d.querySelectorAll('#mlist [data-to]').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'':'none')};
}

/* ================= FOLHAS / AVISOS ================= */
function sheet(html){closeSheet();const d=document.createElement('div');d.className='sheetbg';d.id='sheetbg';d.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;d.onclick=e=>{if(e.target===d)closeSheet()};document.body.appendChild(d);return d}
function closeSheet(){$('#sheetbg')?.remove()}
function toast(m){$('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function promptName(title,val,cb,ph){
  const d=sheet(`<h3>${esc(title)}</h3><input class="field" id="nm" value="${esc(val)}" placeholder="${esc(ph||'Ex.: Paredão, Eletrônica, Funk…')}"><button class="bigbtn" id="ok">${ic('check')} Salvar</button>`);
  const f=d.querySelector('#nm');setTimeout(()=>f.focus(),100);
  const ok=()=>{const v=f.value.trim();if(!v)return;closeSheet();cb(v)};
  d.querySelector('#ok').onclick=ok;f.onkeydown=e=>{if(e.key==='Enter')ok()};
}
function confirmSheet(t,p,btn,cb){const d=sheet(`<h3>${esc(t)}</h3><p>${esc(p)}</p><div class="row2"><button class="btn2" id="no">Cancelar</button><button class="bigbtn" id="yes">${esc(btn)}</button></div>`);d.querySelector('#no').onclick=closeSheet;d.querySelector('#yes').onclick=()=>{closeSheet();cb()}}
function pickPlaylist(keys){
  const d=sheet(`<h3>Adicionar à playlist</h3><p>${keys.length} música(s)</p>
    ${S.playlists.map(p=>`<button class="plc" data-pick="${p.id}">${coverHTML(IDB.mem['p:'+p.id],p.name)}<span><b>${esc(p.name)}</b><small>${p.items.length} músicas</small></span></button>`).join('')}
    <button class="ghost" id="newpl">${ic('plus')} Nova playlist</button>`);
  d.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const p=S.playlists.find(x=>x.id===b.dataset.pick);let n=0;keys.forEach(k=>{if(!p.items.includes(k)){p.items.push(k);n++}});save.pl();closeSheet();toast(n+' adicionada(s) em '+p.name)});
  d.querySelector('#newpl').onclick=()=>promptName('Nova playlist','',name=>{S.playlists.push({id:'p'+Date.now(),name,items:[...new Set(keys)]});save.pl();toast(keys.length+' em '+name)});
}
function setConn(){
  const c=$('#connBtn');c.className='hbtn '+(S.mode==='ble'?'on':S.mode==='demo'?'demo':'');$('#connTxt').textContent={off:'Conectar',ble:'Conectado',demo:'Demo'}[S.mode];
  const p=$('#pwrBtn');p.classList.toggle('hide',S.mode==='off');p.className='hbtn pwr '+(S.power?'on':'off')+(S.mode==='off'?' hide':'');p.innerHTML=ic('power');
}
$('#connBtn').onclick=()=>{S.mode==='off'?connect():go('settings')};
$('#pwrBtn').onclick=()=>{const on=!S.power;confirmSheet(on?'Ligar o aparelho?':'Desligar o aparelho?',on?'O DS Player vai ligar.':'O som vai parar.',on?'Ligar':'Desligar',()=>setPower(on))};
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{renderPanel();renderMini()},150)});

/* ================= DEMONSTRAÇÃO ================= */
function startDemo(){
  const data={'FUNK':['MC Exemplo - Faixa 1','MC Exemplo - Faixa 2','Montagem Paredão','Funk Automotivo 2026'],'HOUSE':['House Mix 01','House Mix 02','Deep Session'],'TECHNO':['Techno Drive','Pancadão Techno'],'ELETRONICA':['Set Eletrônico'],'PISEIRO':['Piseiro 01','Piseiro 02','Piseiro 03','Piseiro 04','Piseiro 05'],'SERTANEJO':['Sertanejo Ao Vivo 1','Sertanejo Ao Vivo 2'],'TESTE DE SOM':['Grave 30Hz','Grave 40Hz','Varredura 20-200Hz'],'':['Vinheta @guucds']};
  const tracks=[];let i=1;Object.entries(data).forEach(([f,arr])=>arr.forEach(n=>tracks.push({i:i++,name:n.toUpperCase()+'.MP3',folder:f})));
  S.lib={total:tracks.length,tracks,done:true,demo:true};
  if(!Object.keys(S.parent).length)S.parent={HOUSE:'ELETRONICA',TECHNO:'ELETRONICA'};
  S.mode='demo';S.status={index:3,total:tracks.length,dir:1,dirs:8,pmode:1};S.playing=true;
  toast('Demonstração: nada é enviado ao aparelho');renderAll();
}
function demoAct(a){
  const st=S.status,t=S.lib.tracks,k=t.findIndex(x=>x.i===st.index);
  if(a==='next')st.index=t[(k+1)%t.length].i;
  if(a==='prev')st.index=t[(k-1+t.length)%t.length].i;
  if(a==='fnext'||a==='fprev'){const f=t[k]?.folder;const d=a==='fnext'?1:-1;let j=k;do{j=(j+d+t.length)%t.length}while(t[j].folder===f&&j!==k);st.index=t[j].i}
  addRecent(st.index);
}

IDB.open().then(()=>IDB.loadAll()).then(()=>renderAll());
renderAll();
